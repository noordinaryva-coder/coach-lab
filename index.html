/* ------------------------------------------------------------------ *
 *  DEPLOYMENT SWITCH — change this one line before you ship.
 *
 *  Preview inside Claude:  "https://api.anthropic.com/v1/messages"
 *  Live on a website:      "/api/claude"
 *
 *  The live value routes through deploy/api/claude.js, which holds the
 *  API key server-side. Shipping the preview value to a real site means
 *  every request returns 401 and nothing generates.
 * ------------------------------------------------------------------ */
const API_URL = "/api/claude";  // deployed value

const MODEL = "claude-sonnet-5";

async function callClaude({ system, messages, maxTokens = 1000 }) {
  let res;
  try {
    res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: MODEL, max_tokens: maxTokens, system, messages }),
    });
  } catch (netErr) {
    throw new Error("Could not reach the model — check your connection.");
  }
  if (!res.ok) {
    if (res.status === 401 || res.status === 403)
      throw new Error("Not authorised (" + res.status + "). On the deployed site, set API_URL to '/api/claude' " +
        "and check ANTHROPIC_API_KEY is set.");
    if (res.status === 404)
      throw new Error("Endpoint not found (404) — API_URL points somewhere that does not exist.");
    if (res.status === 429)
      throw new Error("Rate limited (429) — wait a moment and try again.");
    throw new Error("Request failed (" + res.status + ")");
  }
  const data = await res.json();
  const blocks = Array.isArray(data.content) ? data.content : [];
  const text = blocks.filter((b) => b.type === "text" && b.text).map((b) => b.text).join("\n");
  if (!text.trim()) {
    // 200 but nothing usable — say what actually came back so it is debuggable.
    const kinds = blocks.map((b) => b.type).join(", ") || "none";
    const stop = data.stop_reason ? " stop_reason=" + data.stop_reason : "";
    const err = data.error && data.error.message ? " " + data.error.message : "";
    throw new Error("Model returned no text (blocks: " + kinds + stop + ")." + err);
  }
  return text;
}

function repairJSON(text) {
  let t = text.replace(/,\s*$/, "");
  const stack = [];
  let inStr = false, esc = false;
  for (const ch of t) {
    if (esc) { esc = false; continue; }
    if (ch === "\\") { esc = true; continue; }
    if (ch === '"') { inStr = !inStr; continue; }
    if (inStr) continue;
    if (ch === "{" || ch === "[") stack.push(ch);
    else if (ch === "}" || ch === "]") stack.pop();
  }
  if (inStr) t += '"';                       // close a string cut mid-word
  t = t.replace(/,\s*$/, "");
  while (stack.length) t += stack.pop() === "{" ? "}" : "]";
  return t;
}

function parseJSON(raw) {
  const c = raw.replace(/```json/g, "").replace(/```/g, "").trim();
  const s = c.indexOf("{");
  if (s === -1) throw new Error("No JSON in response. Got: " + (c.slice(0, 120) || "(empty)"));
  const e = c.lastIndexOf("}");
  const whole = e > s ? c.slice(s, e + 1) : null;
  if (whole) { try { return JSON.parse(whole); } catch (err) { /* fall through */ } }
  // Truncated output: close what is open and keep the complete parts.
  try { return JSON.parse(repairJSON(c.slice(s))); } catch (err) {
    // Last resort: drop the final incomplete array element and try again.
    const cut = c.slice(s).lastIndexOf("],");
    if (cut > 0) { try { return JSON.parse(repairJSON(c.slice(s, cut + 1))); } catch (e2) { /* noop */ } }
    throw new Error("Could not parse response (" + c.length + " chars, likely truncated)");
  }
}

async function callJSON(opts, retries = 2) {
  let last;
  for (let i = 0; i <= retries; i++) {
    try { return parseJSON(await callClaude(opts)); } catch (e) { last = e; }
  }
  throw last;
}

function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function toSecs(v) {
  if (v === null || v === undefined) return null;
  const s = String(v).trim();
  const clock = s.match(/^(\d+):([0-5]\d)$/);
  if (clock) return parseInt(clock[1], 10) * 60 + parseInt(clock[2], 10);
  const mins = s.match(/([\d.]+)\s*min/i);
  if (mins) return Math.round(parseFloat(mins[1]) * 60);
  const num = s.match(/([\d.]+)/);
  return num ? Math.round(parseFloat(num[1])) : null;
}
function fmtSecs(n) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  const m = Math.floor(n / 60);
  const s = Math.round(n % 60);
  return m + ":" + String(s).padStart(2, "0");
}
function fmtDurationLong(totalSecs) {
  const m = Math.floor(totalSecs / 60);
  const s = Math.round(totalSecs % 60);
  return m + " mins " + s + " seconds";
}

/* Facilitator gate. Client-side only — this keeps learners out of the answer keys,
   it is not security. Real access control is the middleware in deploy/. */
const BUILDER_PASSWORD = "coachplan";

function BuilderGate({ onUnlock }) {
  const [pw, setPw] = useState("");
  const [bad, setBad] = useState(false);
  function tryUnlock() {
    if (pw === BUILDER_PASSWORD) onUnlock();
    else { setBad(true); setPw(""); }
  }
  return (
    <div className="cl-gate">
      <div className="cl-gate-box">
        <div className="cl-gate-slash" aria-hidden="true" />
        <p className="cl-eyebrow">Facilitators only</p>
        <h2 className="cl-h2">The case builder is locked</h2>
        {bad && <p className="cl-error"><strong>Wrong password</strong> — try again.</p>}
        <input type="password" value={pw} autoFocus placeholder="Password"
          onChange={(e) => { setPw(e.target.value); setBad(false); }}
          onKeyDown={(e) => e.key === "Enter" && tryUnlock()} />
        <button className="cl-btn cl-go" onClick={tryUnlock}>Unlock</button>
      </div>
    </div>
  );
}

class Boundary extends React.Component {
  constructor(props) { super(props); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err, info) { console.error("Coach Lab crashed:", err, info); }
  render() {
    if (!this.state.err) return this.props.children;
    return (
      <div className="cl">
        <style>{CSS}</style>
        <div className="cl-gate">
          <div className="cl-gate-box">
            <div className="cl-gate-slash" aria-hidden="true" />
            <p className="cl-eyebrow">Something broke</p>
            <h2 className="cl-h2">This screen stopped working</h2>
            <p className="cl-lede">
              Nothing you downloaded is affected. Reloading starts a fresh session — anything
              generated but not yet downloaded will be lost.
            </p>
            <p className="cl-fine">{String(this.state.err && this.state.err.message)}</p>
            <button className="cl-btn cl-go" onClick={() => window.location.reload()}>Reload</button>
          </div>
        </div>
      </div>
    );
  }
}

function CaseStudy({ onCoach }) {
  const [step, setStep] = useState(0);
  const [p, setP] = useState({
    account: "paypal", customAccount: "", customSector: "",
    channel: "Blended", driver: "", driverMode: "list",
    name: "", tenure: "95 days", disc: "High D", discNote: "",

  const [scripts, setScripts] = useState([]);
  const [answers, setAnswers] = useState([]);
  const [busy, setBusy] = useState("");
  const [prog, setProg] = useState(0);
  const [error, setError] = useState("");

  const set = (k, v) => setP((x) => ({ ...x, [k]: v }));

  const acct = ACCOUNTS.find((a) => a.id === p.account) || ACCOUNTS[0];
  const isCustom = p.account === "custom";
  const accountName = isCustom ? (p.customAccount.trim() || "Unnamed account") : acct.name;
  const sector = isCustom ? (p.customSector.trim() || "Customer service") : acct.sector;
  const accountLine = accountName + " · " + sector + " · " + p.channel + (p.driver ? " · " + p.driver : "");

  function pickAccount(id) {
    const a = ACCOUNTS.find((x) => x.id === id) || ACCOUNTS[0];
    setP((x) => ({ ...x, account: id, channel: a.channel || x.channel, driver: "", driverMode: "list" }));
    setMetrics(null); setScripts([]); setAnswers([]); setStep(0); setError("");
  }

  async function invent() {
    setBusy("invent"); setError("");
    try {
      const j = await callJSON({
        system:

          "company the BPO supports; the teammate is fictional. Return ONLY JSON, no fences: " +
          '{"driver":"the specific contact reason this teammate handles on this account",' +

  }

    if (!p.name.trim()) { setError("Give the teammate a name first."); return; }
    setBusy("metrics"); setError("");
    try {
      const j = await callJSON({
        system:
          "You generate performance trend tables for contact centre coaching case studies. " +
          "Choose metric columns that fit the industry and channel — voice accounts use AHT, Average Talk Time, ACW, " +

          "Put a Standard column immediately after each metric that has one, and always include one for the problem KPM.\n" +
          "The table must be diagnosable: the problem KPM clearly breaches standard and worsens across the three " +
          "periods, one or two driver KPIs move in step with it, and at least two other metrics improve so there is " +
          "something genuinely worth reinforcing. Numbers must be internally consistent — talk time, ACW and hold time " +
          "should broadly track AHT. Use realistic values, never round numbers.\n" +
          'Return ONLY JSON, no fences: {"columns":["Pay Period","CSAT","CSAT Standard","AHT","AHT Standard",...],' +

    const i = metrics.columns.findIndex((c) => new RegExp(frag, "i").test(c) && !/standard/i.test(c));
    if (i === -1) return null;
    return metrics.rows[metrics.rows.length - 1][i];

  const [promptCopied, setPromptCopied] = useState(false);

  function buildTranscriptPrompt() {
    const table = metrics.columns.join(" | ") + "\n" + metrics.rows.map((r) => r.join(" | ")).join("\n");

    const acw = toSecs(latestVal("ACW")) || 0;
    const talk = toSecs(latestVal("Talk")) || Math.max(60, aht - hold - acw);
    const convo = talk + hold;
    const period = metrics.rows[metrics.rows.length - 1][0];
    const resolvedDriver = p.driver || "the account's most common contact reason";
    const SPREAD = [0.6, 1.0, 1.42];

    return "You write realistic contact centre " + (p.channel === "Chat" ? "chat" : "call") + " transcripts that serve " +
      "as evidence in a coaching case study. The transcript is the proof of the behaviour — a facilitator must be " +
      "able to point at a timestamp and say 'there it is'.\n\n" +
      "CASE CONTEXT\n" +
      "Account: " + accountLine + "\n" +
      "Agent: " + p.name + ", tenure " + p.tenure + ", DISC " + p.disc + (p.discNote ? " (" + p.discNote + ")" : "") + "\n" +

      "Problem KPM: " + p.kpm + "\nProblem behaviour: " + p.behaviour + "\nPay period: " + period + "\n\n" +
      "PERFORMANCE TREND (the transcripts must be consistent with this table)\n" + table + "\n\n" +
      "HARD CONSTRAINTS\n" +
      "- Handle time is talk + hold + after-call work. The CONVERSATION you write covers talk + hold only; wrap " +
      "happens after the customer is gone and is never in the transcript.\n" +
      "- Write exactly THREE contacts. Each has its OWN target length — one shorter, one typical, one long — because " +
      "three calls at identical length read as fabricated. Targets: contact 1 ≈ " + fmtSecs(Math.round(convo * SPREAD[0])) +
      ", contact 2 ≈ " + fmtSecs(Math.round(convo * SPREAD[1])) + ", contact 3 ≈ " + fmtSecs(Math.round(convo * SPREAD[2])) +
      " of conversation — averaging out near " + fmtSecs(convo) + ". Make contact 3 the clearest example of the problem behaviour.\n" +
      "- Do NOT reach the target length by writing more turns. Reach it the way a real slow call gets slow: leave " +
      "real gaps between timestamps and account for them with System lines — 'Agent searching order system — 40 " +
      "seconds of silence', 'Placed customer on hold — 1:20', 'Agent re-verifying account details — 35 seconds'. " +
      "Gaps of 30 to 90 seconds between turns are normal on a call this long.\n" +
      "- Hold must total roughly " + hold + " seconds across each contact. If hold is near zero, carry the length " +
      "through dead air and over-explaining instead of inventing holds.\n" +
      "- Every contact is dated inside the pay period " + period + ".\n" +
      "- Every evidence timestamp must be copied exactly from a turn you wrote.\n" +
      "- The problem behaviour must be visibly, specifically present — demonstrated in what the agent says, never described.\n" +
      "- Include at least one genuine strength per contact so it is not a hit piece.\n" +
      "- The customer is a real person with a real problem, not a prop. Keep turns short and natural, under 24 words each.\n" +
      "- Sound like this specific account — real product names, screens, policies, timeframes and jargon, not generic filler.\n\n" +
      "OUTPUT\n" +
      "Write all 3 contacts as plain, readable transcripts — no JSON, no code block, just formatted text a coach " +
      "can read straight off the page. Use exactly this layout for each contact:\n\n" +
      "CONTACT 1 — CN-XXXXXXX\n" +
      "[date] · " + resolvedDriver + " · Duration [m:ss] · Talk [m:ss] · Hold [m:ss] · ACW [m:ss] · [Disposition]\n\n" +
      "[00:00] AGENT: what the agent says\n" +
      "[00:18] CUSTOMER: what the customer says\n" +
      "[01:31] SYSTEM: Agent searching order system — 40 seconds of silence\n" +
      "... every turn, in order, same style ...\n\n" +
      "OUTCOME: one line on how the contact ended\n\n" +
      "EVIDENCE (facilitator notes — exactly 3 per contact):\n" +
      "[mm:ss] MISS — short KSB name: what this moment shows\n" +
      "[mm:ss] STRENGTH — short KSB name: what this moment shows\n" +
      "(every evidence timestamp must exactly match one of the turn timestamps above it)\n\n" +
      "Separate the 3 contacts with a line of dashes (---). Between 10 and 18 turns per contact.";
  }

  async function copyTranscriptPrompt() {
    try {
      await navigator.clipboard.writeText(buildTranscriptPrompt());
      setPromptCopied(true);
      setTimeout(() => setPromptCopied(false), 2500);
    } catch (e) {
      setError("Couldn't copy automatically — your browser may be blocking clipboard access.");
    }
  }

  async function buildScripts() {
    setBusy("scripts"); setError(""); setProg(0);
    setScripts([]); setAnswers([]);                    // downstream state is now stale
    const table = metrics.columns.join(" | ") + "\n" + metrics.rows.map((r) => r.join(" | ")).join("\n");
    const ahtRaw = toSecs(latestVal("^AHT|Handle"));
    const aht = ahtRaw || 600;
    const hold = toSecs(latestVal("Hold")) || 0;
    const acw = toSecs(latestVal("ACW")) || 0;
    // AHT = talk + hold + ACW, so the conversation itself runs AHT minus wrap.
    const talk = toSecs(latestVal("Talk")) || Math.max(60, aht - hold - acw);
    const convo = talk + hold;
    const period = metrics.rows[metrics.rows.length - 1][0];
    const resolvedDriver = p.driver || "the account's most common contact reason";
    // A long call is not more turns — it is the same turns with visible dead time between them.
    // Real contacts vary. Three calls that all run exactly to AHT is the giveaway that they are fake.
    const SPREAD = [0.6, 1.0, 1.42];   // averages to ~1.0 of the target

    const sys =
      "You write realistic contact centre " + (p.channel === "Chat" ? "chat" : "call") + " transcripts that serve as " +
      "evidence in a coaching case study. The transcript is the proof of the behaviour — a facilitator must be able " +
      "to point at a timestamp and say 'there it is'.\n" +
      "HARD CONSTRAINTS:\n" +
      "- Handle time is talk + hold + after-call work. The CONVERSATION you write covers talk + hold only; wrap " +
      "happens after the customer is gone and is never in the transcript.\n" +
      "- Each contact is given its OWN target length below. Hit that one, not the pay-period average. The three " +
      "contacts deliberately differ \u2014 one shorter, one typical, one long \u2014 because real contacts vary and " +
      "three calls that all run to exactly the same length read as fabricated. What matters is that the behaviour " +
      "is visible in each, and that the three AVERAGE out near " + fmtSecs(convo) + ".\n" +
      "- Do NOT reach that length by writing more turns. Reach it the way a real slow call gets slow: leave real " +
      "gaps between timestamps and account for them. Use System lines for the dead time — 'Agent searching order " +
      "system — 40 seconds of silence', 'Placed customer on hold — 1:20', 'Agent re-verifying account details — " +
      "35 seconds'. Show the agent re-explaining something already covered, re-asking for information the customer " +
      "already gave, or narrating their own clicking. Gaps of 30 to 90 seconds between turns are normal on a call " +
      "this long and are exactly what the coach needs to see.\n" +
      "- Hold must total roughly " + hold + " seconds across the contact. If hold is near zero, do not invent holds " +
      "— carry the length through dead air and over-explaining instead.\n" +
      "- The contact must be dated inside the pay period " + period + ".\n" +
      "- Every evidence timestamp must be copied exactly from one of the turns you wrote.\n" +
      "- The problem behaviour is: " + p.behaviour + ". It must be visibly, specifically present — demonstrated in " +
      "what the agent actually says, never described.\n" +
      "- Include at least one genuine strength so the case is not a hit piece.\n" +
      "- The customer is a real person with a real problem, not a prop. Keep turns short and natural.\n" +
      "- Sound like this specific account. Use the product names, screens, policies, timeframes and jargon a real " +
      "agent on " + accountName + " would use — not generic 'your account' filler. The customer's problem must be " +
      "one that only makes sense on this account.\n" +
      'Return ONLY JSON, no fences. Use this COMPACT shape exactly — short keys, turns and evidence as arrays:\n' +
      '{"id":"CN-4471902","date":"a date inside ' + period + '","driver":"the contact reason",' +
      '"dur":' + convo + ',"talk":' + talk + ',"hold":' + hold + ',"acw":' + acw + ',"disp":"Resolved","out":"one line on how it ended",' +
      '"t":[["00:00","A","what the agent says"],["01:10","C","what the customer says"],["03:20","S","Placed customer on hold — 1:20"]],' +
      '"e":[["03:20","miss","short KSB name","what this moment shows"]]}\n' +
      'Speakers are "A" for agent, "C" for customer, "S" for system. dur, talk, hold and acw are plain numbers of seconds.\n' +
      "Between 10 and 18 turns, spread across this contact's own target length. Exactly 3 evidence entries. " +
      "Every turn under 24 words. Keep the wording tight — a truncated response is useless — but keep the CLOCK honest.";

    const SPEAKER = { A: "Agent", C: "Customer", S: "System" };
    function normalize(j, i) {
      // Accepts the compact shape, and the older verbose shape if the model reverts to it.
      const turnsRaw = j.t || j.turns || [];
      const evRaw = j.e || j.evidence || [];
      const turns = turnsRaw.map((x) => Array.isArray(x)
        ? { t: String(x[0] || ""), speaker: SPEAKER[x[1]] || x[1] || "Agent", text: String(x[2] || "") }
        : { t: x.t, speaker: x.speaker, text: x.text });
      const evidence = evRaw.map((x) => Array.isArray(x)
        ? { t: String(x[0] || ""), type: x[1] === "strength" ? "strength" : "miss", ksb: x[2] || "", note: x[3] || "" }
        : { t: x.t, type: x.type, ksb: x.ksb, note: x.note });
      const talkN = Number(j.talk ?? j.talk_secs) || 0;
      const holdN = Number(j.hold ?? j.hold_secs) || 0;
      // Trust the clock, not the self-reported number. A transcript that ends at 4:00
      // is a 4:00 contact no matter what the model puts in "dur".
      const lastStamp = turns.length ? toSecs(turns[turns.length - 1].t) : null;
      const claimed = Number(j.dur ?? j.duration_secs) || talkN + holdN;
      const actual = lastStamp || claimed;
      return {
        contact_id: j.id || j.contact_id || "CN-" + (i + 1),
        date: j.date || period,
        driver: j.driver || resolvedDriver,
        duration_secs: actual,
        claimed_secs: claimed,
        short: actual < Math.round(convo * SPREAD[i]) * 0.7,
        talk_secs: talkN, hold_secs: holdN,
        acw_secs: Number(j.acw ?? j.acw_secs) || 0,
        disposition: j.disp || j.disposition || "Resolved",
        outcome: j.out || j.outcome || "",
        turns, evidence,
      };
    }

    const out = [];
    const failures = [];
    for (let i = 0; i < 3; i++) {
      try {
        const j = await callJSON({
          system: sys,
          messages: [{ role: "user", content:
            "Account: " + accountLine +
            "\nContact driver for all three contacts: " + resolvedDriver +
            "\nAgent: " + p.name + ", tenure " + p.tenure + ", DISC " + p.disc + " (" + p.discNote + ")" +
            "\nProblem KPM: " + p.kpm + "\nPay period: " + period +
            "\n\nFull trend:\n" + table +
            "\n\nThis is contact " + (i + 1) + " of 3. Same driver, different customer, different flavour of the " +
            "same problem.\nTHIS CONTACT'S TARGET LENGTH: " + fmtSecs(Math.round(convo * SPREAD[i])) +
            " (" + Math.round(convo * SPREAD[i]) + " seconds of conversation). Its final timestamp must land near " +
            "that, not near the pay-period average." +
            (i === 2 ? " Make this one the clearest example of the problem behaviour." : "") +
            (scriptNotes.trim()
              ? "\n\nFACILITATOR NOTES on the previous attempt — these override the defaults, follow them exactly:\n" +
                scriptNotes.trim()
              : "") }],
          maxTokens: 2000,
        });
        let n = normalize(j, i);
        if (!n.turns.length) throw new Error("no turns returned");
        if (n.short) {
          // The clock came back too short. Ask again, naming the failure explicitly.
          try {
            const j2 = await callJSON({
              system: sys,
              messages: [{ role: "user", content:
                "Account: " + accountLine + "\nDriver: " + resolvedDriver +
                "\nAgent: " + p.name + " (" + p.disc + ")\nPay period: " + period +
                "\n\nYour previous attempt ended at " + fmtSecs(n.duration_secs) + ", but this contact must run " +
                "about " + fmtSecs(Math.round(convo * SPREAD[i])) + ". Rewrite it. Keep the same story and roughly the " +
                "same number of turns, " +
                "but stretch the CLOCK: bigger gaps between timestamps, System lines accounting for the dead time, " +
                "the agent re-explaining and re-verifying. The final timestamp must be close to " +
                fmtSecs(Math.round(convo * SPREAD[i])) + "." }],
              maxTokens: 2000,
            });
            const n2 = normalize(j2, i);
            if (n2.turns.length && n2.duration_secs > n.duration_secs) n = n2;
          } catch (e2) { /* keep the short one and let the badge flag it */ }
        }
        out.push(n);
      } catch (e) {
        failures.push("Contact " + (i + 1) + ": " + (e && e.message ? e.message : "unknown error"));
        out.push({ failed: true, contact_id: "Contact " + (i + 1), reason: e && e.message });
      }
      setScripts([...out]); setProg(i + 1);
    }
    if (failures.length) setError(failures.join(" · ") + " — press Regenerate to retry just these.");
    setBusy(""); setStep(2);
  }

  const ALIGN_TOLERANCE = 15;

  const check = React.useMemo(() => {
    if (!metrics || scripts.length === 0) return null;
    const ok = scripts.filter((s) => !s.failed);
    if (!ok.length) return null;
    const avg = (k) => Math.round(ok.reduce((a, s) => a + (Number(s[k]) || 0), 0) / ok.length);
    const talkAvg = avg("talk_secs"), holdAvg = avg("hold_secs"), acwAvg = avg("acw_secs");
    return [
      // AHT = talk + hold + ACW, so the contacts' AHT is rebuilt from its parts, not read off duration.
      { label: "Handle time (talk + hold + ACW)", table: toSecs(latestVal("^AHT|Handle")), calls: talkAvg + holdAvg + acwAvg },
      { label: "Conversation length", table: (toSecs(latestVal("Talk")) || 0) + (toSecs(latestVal("Hold")) || 0), calls: avg("duration_secs") },
      { label: "Talk time", table: toSecs(latestVal("Talk")), calls: talkAvg },
      { label: "Hold time", table: toSecs(latestVal("Hold")), calls: holdAvg },
      { label: "After-call work", table: toSecs(latestVal("ACW")), calls: acwAvg },
    ].filter((r) => r.table !== null && r.table !== undefined && r.table > 0).map((r) => {
      const delta = Math.round(((r.calls - r.table) / Math.max(r.table, 1)) * 100);
      return { ...r, delta, aligned: Math.abs(delta) <= ALIGN_TOLERANCE };
    });
  }, [metrics, scripts]);

  const datesOutOfPeriod = React.useMemo(() => {
    if (!metrics || !scripts.length) return [];
    const period = String(metrics.rows[metrics.rows.length - 1][0] || "");
    const month = (period.match(/[A-Za-z]{3,}/) || [""])[0].slice(0, 3).toLowerCase();
    if (!month) return [];
    return scripts.filter((s) => !s.failed && s.date &&
      !String(s.date).toLowerCase().includes(month)).map((s) => s.contact_id);
  }, [metrics, scripts]);

  async function buildKey() {
    setBusy("key"); setError(""); setProg(0);
    const table = metrics.columns.join(" | ") + "\n" + metrics.rows.map((r) => r.join(" | ")).join("\n");
    const evidence = scripts.filter((s) => !s.failed).map((s) =>
      s.contact_id + " (" + s.driver + ", " + fmtSecs(s.duration_secs) + ", hold " + fmtSecs(s.hold_secs) + "): " +
      (s.evidence || []).map((e) => e.t + " " + e.type + " — " + e.ksb + ": " + e.note).join(" | ")).join("\n");
    const ctx =
      "Account: " + accountLine + "\nTeammate: " + p.name + "\nTenure: " + p.tenure +
      "\nDISC style: " + p.disc + " — " + p.discNote + "\nAttendance: " + p.attendance +
      "\nStar status: " + starText(p.star) + "\nHow to coach this status: " + starOf(p.star).coach +
      "\nContext: " + p.context +
      "\n\nPerformance trend:\n" + table + "\n\nCall evidence:\n" + evidence;

    const out = [];
    for (const act of ACTIVITIES) {
      try {
        const j = await callJSON({
          system:
            "You write facilitator answer keys for contact centre coaching case studies. The programme uses DMAIC and " +
            "GROW, and the vocabulary KSB, KPM, KPI, QAQ probing, giraffe language, connect then correct, SMART action " +
            "plan, Star Status, Coach Plan. Answers must cite the actual numbers, the actual profile and the actual " +
            "contact IDs and timestamps — never generic. Write the way a filled-in worksheet reads: tight, concrete, " +
            "no hedging, no preamble.\n" +
            'Return ONLY JSON, no fences: {"fields":[{"label":"short field name","value":"the answer"}]}\n' +
            "Between two and six fields. When the activity asks for a fixed number of items, give each item its own " +
            "field rather than packing several into one value.",
          messages: [{ role: "user", content:
            ctx + "\n\nActivity: " + act.title + "\nWhat the group is asked: " + act.prompt +
            "\nWhat the answer key must contain: " + act.ask }],
          maxTokens: 1500,
        });
        out.push({ ...act, fields: j.fields || [] });
      } catch (e) { out.push({ ...act, fields: [], failed: true }); }
      setAnswers([...out]); setProg(out.length);
    }
    setBusy(""); setStep(3);
  }

  function editField(ai, fi, v) {
    setAnswers((a) => {
      const next = a.map((x) => ({ ...x, fields: x.fields.map((f) => ({ ...f })) }));
      next[ai].fields[fi].value = v;
      return next;
    });
  }

  function exportExcel() {
    const wb = XLSX.utils.book_new();
    const info = [
      ["CASE STUDY — " + accountName], [],
      ["ACCOUNT"], ["Account", accountName], ["Business", sector],
      ["Channel", p.channel], ["Contact driver", p.driver || "Not specified"], [],
      ["TEAMMATE PROFILE"], ["Name", p.name], ["Tenure", p.tenure],
      ["DISC style", p.disc], ["", p.discNote], ["Attendance", p.attendance],
      ["Star Status", starText(p.star)], ["", p.context],
    ];
    const ws1 = XLSX.utils.aoa_to_sheet(info);
    ws1["!cols"] = [{ wch: 18 }, { wch: 78 }];
    XLSX.utils.book_append_sheet(wb, ws1, "Profile");

    const ws2 = XLSX.utils.aoa_to_sheet([metrics.columns, ...metrics.rows]);
    ws2["!cols"] = metrics.columns.map((c, i) => ({ wch: i === 0 ? 18 : Math.max(12, c.length + 2) }));
    XLSX.utils.book_append_sheet(wb, ws2, "Performance Trend");

    if (scripts.length) {
      const aoa = [["Contact ID", "Date", "Driver", "Duration", "Talk", "Hold", "ACW", "Disposition"]];
      scripts.filter((s) => !s.failed).forEach((s) => aoa.push([s.contact_id, s.date, s.driver,
        fmtSecs(s.duration_secs), fmtSecs(s.talk_secs), fmtSecs(s.hold_secs), fmtSecs(s.acw_secs), s.disposition]));
      if (check) {
        aoa.push([]); aoa.push(["CROSS-CHECK", "From table", "From contacts", "Delta"]);
        check.forEach((r) => aoa.push([r.label, fmtSecs(r.table), fmtSecs(r.calls), (r.delta > 0 ? "+" : "") + r.delta + "%"]));
      }
      const ws3 = XLSX.utils.aoa_to_sheet(aoa);
      ws3["!cols"] = [{ wch: 16 }, { wch: 16 }, { wch: 30 }, { wch: 11 }, { wch: 11 }, { wch: 11 }, { wch: 11 }, { wch: 20 }];
      XLSX.utils.book_append_sheet(wb, ws3, "Contacts");

      // full turn-by-turn transcripts, one sheet per contact
      scripts.filter((x) => !x.failed).forEach((x, i) => {
        const t = [["CONTACT", x.contact_id], ["Driver", x.driver], ["Date", x.date],
          ["Duration", fmtSecs(x.duration_secs)], ["Talk", fmtSecs(x.talk_secs)],
          ["Hold", fmtSecs(x.hold_secs)], ["ACW", fmtSecs(x.acw_secs)],
          ["Disposition", x.disposition], [], ["Time", "Speaker", "What was said"]];
        (x.turns || []).forEach((tn) => t.push([tn.t, tn.speaker, tn.text]));
        if ((x.evidence || []).length) {
          t.push([]); t.push(["ANNOTATIONS (facilitator)"]);
          t.push(["Time", "Type", "KSB", "What it shows"]);
          x.evidence.forEach((e) => t.push([e.t, e.type === "miss" ? "MISS" : "STRENGTH", e.ksb, e.note]));
        }
        const ws = XLSX.utils.aoa_to_sheet(t);
        ws["!cols"] = [{ wch: 10 }, { wch: 12 }, { wch: 80 }, { wch: 40 }];
        XLSX.utils.book_append_sheet(wb, ws, "Contact " + (i + 1));
      });
    }
    const safe = (p.name || "case").replace(/[^a-z0-9]+/gi, "-").toLowerCase();
    XLSX.writeFile(wb, safe + "-case-metrics.xlsx");
  }

  function printDoc(mode) { setPrintMode(mode); setTimeout(() => window.print(), 150); }

  function exportHTML(mode) {
    const html = buildPrintHTML({ p, accountLine, metrics, scripts, answers, check, mode });
    const safe = (p.name || "case").replace(/[^a-z0-9]+/gi, "-").toLowerCase();
    const suffix = mode === "key" ? "answer-key" : mode === "early" ? "metrics-profile" : "handout";
    try {
      download(new Blob([html], { type: "text/html" }), safe + "-" + suffix + "-print-me.html");
    } catch (e) {
      setError("Download was blocked by the browser. Try the print buttons instead.");
    }
  }

  const ready = metrics && scripts.length > 0 && answers.length > 0;

  return (
    <div className="cl-case">
      <ol className="cl-steps">
        {STEPS.map((s, i) => {
          const reachable =
            i === 0 || (i === 1 && metrics) || (i === 2 && scripts.length) ||
            (i === 3 && answers.length) || (i === 4 && ready);
          return (
            <li key={s} className={i === step ? "is-on" : i < step ? "is-done" : ""}>
              <button disabled={!reachable || !!busy} onClick={() => setStep(i)}>
                <span>{String(i + 1).padStart(2, "0")}</span>{s}
              </button>
            </li>
          );
        })}
      </ol>

      {error && <p className="cl-error">{error}</p>}

      {step === 0 && (
        <div className="cl-two">
          <div className="cl-card">
            <p className="cl-eyebrow">Step one</p>
            <h2 className="cl-h2">The account and the teammate</h2>
            <p className="cl-lede">
              Pick the business first — it drives the metric set, the contact drivers and how the
              transcripts sound. Then let it invent the rest, or type your own.
            </p>
            <div className="cl-accounts">
              {ACCOUNTS.map((a) => (
                <button key={a.id} className={"cl-acct" + (p.account === a.id ? " is-on" : "")}
                  disabled={!!busy} onClick={() => pickAccount(a.id)}>{a.name}</button>
              ))}
            </div>

            {isCustom && (
              <div className="cl-grid2 cl-mt">
                <Field label="Account name">
                  <input value={p.customAccount} onChange={(e) => set("customAccount", e.target.value)}
                    placeholder="e.g. Wayfair" />
                </Field>
                <Field label="What kind of business">
                  <input value={p.customSector} onChange={(e) => set("customSector", e.target.value)}
                    placeholder="e.g. Home goods e-commerce" />
                </Field>
              </div>
            )}

            <div className="cl-grid2 cl-mt">
              <Field label="Channel">
                <select value={p.channel} onChange={(e) => set("channel", e.target.value)}>
                  {CHANNELS.map((c) => <option key={c}>{c}</option>)}
                </select>
              </Field>
              <Field label="Contact driver / LOB">
                <select

                  onChange={(e) => {

                  }}>
                  <option value="">Choose a driver…</option>
                  {(acct.drivers || []).map((d) => <option key={d} value={d}>{d}</option>)}
                  <option value="custom">Type a different LOB…</option>
                  <option value="skip">Skip — let the case decide</option>
                </select>
              </Field>
            </div>

            {p.driverMode === "custom" && (
              <Field label="Your LOB">

                  placeholder="e.g. Merchant onboarding escalations" />
              </Field>

            <div className="cl-rule" />
            <div className="cl-grid2">

            <Field label="How that style shows up">

            </Field>
            <Field label="Star Status">
              <select value={p.star} onChange={(e) => set("star", e.target.value)}>
                {STARS.map((x) => <option key={x.id} value={x.id}>{x.label + " \u2014 " + x.axis}</option>)}
              </select>
            </Field>
            <Field label="Context — motivation and life situation">
              <textarea rows={2} value={p.context} onChange={(e) => set("context", e.target.value)}
                placeholder="Aspiring to join LEAP; breadwinner of the family; first call centre experience" />
            </Field>
            <div className="cl-rule" />
            <div className="cl-grid2">
              <Field label="Problem KPM">
                <select value={p.kpm} onChange={(e) => set("kpm", e.target.value)}>
                  {KPMS.map((k) => <option key={k}>{k}</option>)}
                </select>
              </Field>
              <Field label="Difficulty">
                <select value={p.difficulty} onChange={(e) => set("difficulty", e.target.value)}>
                  {DIFFICULTY.map((d) => <option key={d}>{d}</option>)}
                </select>
              </Field>
            </div>
            <Field label="Behaviour the transcripts must show">
              <select value={p.behaviour} onChange={(e) => set("behaviour", e.target.value)}>
                {CASE_BEHAVIOURS.map((b) => <option key={b}>{b}</option>)}
              </select>
            </Field>
            <div className="cl-actions">
              <button className="cl-btn cl-ghost" onClick={invent} disabled={!!busy}>
                {busy === "invent" ? "Inventing…" : "Invent the account"}
              </button>
              <button className="cl-btn cl-go" onClick={buildMetrics} disabled={!!busy}>
                {busy === "metrics" ? "Building the numbers…" : "Generate the metrics"}
              </button>
            </div>
          </div>
          <ProfileCard p={p} accountLine={accountLine} />
        </div>
      )}

      {step === 1 && metrics && (
        <div className="cl-card">
          <p className="cl-eyebrow">Step two · {accountLine}</p>
          <h2 className="cl-h2">Performance trend report</h2>
          <p className="cl-lede">
            Columns are chosen for this account and channel. Click any cell to change it — the
            transcripts in the next step are built to match these numbers.
          </p>
          <MetricsTable metrics={metrics} onEdit={editCell} />
          {metrics.story && <p className="cl-story">{metrics.story}</p>}

          <div className="cl-notes">
            <p className="cl-eyebrow">Notes before regenerating</p>
            <p className="cl-fine">
              Say what is wrong and it will be followed exactly on the next attempt \u2014 rather than
              rolling the dice again. Left blank, nothing changes.
            </p>
            <textarea rows={3} value={metricNotes} onChange={(e) => setMetricNotes(e.target.value)}
              placeholder="Hold time is too extreme, keep it under 2 minutes. Make CSAT improve across all three periods so there is something to reinforce." />
          </div>

          <div className="cl-actions">
            <button className="cl-btn cl-ghost" onClick={() => setStep(0)}>Back</button>
            <button className="cl-btn cl-ghost" onClick={buildMetrics} disabled={!!busy}>
              {busy === "metrics" ? "Regenerating…" : "Regenerate numbers"}
            </button>
            <button className="cl-btn cl-go" onClick={buildScripts} disabled={!!busy}>
              {busy === "scripts" ? "Writing contact " + (prog + 1) + " of 3…" : "Generate the transcripts"}
            </button>
          </div>
          {busy === "scripts" && <Progress n={prog} total={3} />}
          <div className="cl-rule" />
          <p className="cl-eyebrow">If generation keeps failing or drifting from the numbers</p>
          <div className="cl-actions">
            <button className="cl-btn cl-ghost" onClick={copyTranscriptPrompt}>
              {promptCopied ? "Copied ✓" : "📋 Copy prompt for ChatGPT"}
            </button>
            <button className="cl-btn cl-ghost" onClick={() => exportHTML("early")}>
              Download metrics &amp; profile (PDF)
            </button>
          </div>
          <p className="cl-fine">
            The ChatGPT prompt carries over the profile, behaviour and this exact metrics table, so whatever it
            writes still matches what's on screen. The PDF is a safety net — if transcript generation fails after
            this point, you still have a polished export of the two steps that already worked.
          </p>
        </div>
      )}

      {step === 2 && (
        <>
          <div className="cl-keybar">
            <div>
              <p className="cl-eyebrow">Step three</p>
              <h2 className="cl-h2">Contact evidence</h2>
            </div>
            <div className="cl-toggle">
              <button className={showKey ? "" : "is-on"} onClick={() => setShowKey(false)}>Learner view</button>
              <button className={showKey ? "is-on" : ""} onClick={() => setShowKey(true)}>Annotated</button>
            </div>
          </div>
          {datesOutOfPeriod.length > 0 && (
            <p className="cl-error">
              <strong>Dates outside the pay period</strong> — {datesOutOfPeriod.join(", ")} fall outside{" "}
              {metrics.rows[metrics.rows.length - 1][0]}. Edit the date or regenerate, or a learner will catch it.
            </p>
          )}
          {check && <CrossCheck check={check} tolerance={ALIGN_TOLERANCE} />}
          {scripts.map((s, i) => <Transcript key={i} s={s} n={i + 1} showKey={showKey} />)}
          <div className="cl-notes">
            <p className="cl-eyebrow">Notes before regenerating</p>
            <p className="cl-fine">
              Tell it what to change and it will follow that exactly on the next attempt.
            </p>
            <textarea rows={3} value={scriptNotes} onChange={(e) => setScriptNotes(e.target.value)}
              placeholder="Contact 2 was too short. Make the customer angrier in one of them. The agent sounds too polished for 95 days tenure." />
          </div>

          <div className="cl-actions">
            <button className="cl-btn cl-ghost" onClick={() => setStep(1)}>Back to metrics</button>
            <button className="cl-btn cl-ghost" onClick={buildScripts} disabled={!!busy}>
              {busy === "scripts" ? "Regenerating…" : "Regenerate transcripts"}
            </button>
            <button className="cl-btn cl-go" onClick={buildKey} disabled={!!busy}>
              {busy === "key" ? "Writing activity " + (prog + 1) + " of 6…" : "Write the answer key"}
            </button>
          </div>
          {busy === "key" && <Progress n={prog} total={6} />}
        </>
      )}

      {step === 3 && (
        <>
          <div className="cl-keybar">
            <div>
              <p className="cl-eyebrow">Step four</p>
              <h2 className="cl-h2">Answer key</h2>
            </div>
            <div className="cl-toggle">
              <button className={showKey ? "" : "is-on"} onClick={() => setShowKey(false)}>Learner view</button>
              <button className={showKey ? "is-on" : ""} onClick={() => setShowKey(true)}>Answer key</button>
            </div>
          </div>
          {answers.map((a, ai) => (
            <section key={a.id} className="cl-activity">
              <div className="cl-act-head">
                <span className="cl-act-n">{String(ai + 1).padStart(2, "0")}</span>
                <h3>{a.title}</h3>
              </div>
              <p className="cl-act-prompt">{a.prompt}</p>
              {a.failed && <p className="cl-error"><strong>Not generated</strong> — rerun the answer key for this activity.</p>}
              {a.fields.map((f, fi) => (
                <div key={fi} className="cl-field-block">
                  <p className="cl-flabel">{f.label}</p>
                  {showKey ? (
                    <textarea className="cl-answer" value={f.value}
                      rows={Math.min(9, Math.ceil((f.value || "").length / 78) + 1)}
                      onChange={(e) => editField(ai, fi, e.target.value)} />
                  ) : (
                    <div className="cl-blank"
                      style={{ height: Math.min(190, 56 + Math.round((f.value || "").length / 3)) + "px" }} />
                  )}
                </div>
              ))}
            </section>
          ))}
          <div className="cl-actions">
            <button className="cl-btn cl-ghost" onClick={() => setStep(2)}>Back to transcripts</button>
            <button className="cl-btn cl-go" onClick={() => setStep(4)}>Go to export</button>
          </div>
        </>
      )}

      {step === 4 && (
        <div className="cl-two">
          <div className="cl-card">
            <p className="cl-eyebrow">Step five</p>
            <h2 className="cl-h2">Take the files</h2>
            <p className="cl-lede">
              The PDF pack is typeset for print — cover, profile, trend table, all three annotated
              transcripts, and the six activities.
            </p>
            <div className="cl-downloads">
              <button className="cl-dl" onClick={() => exportHTML("key")} disabled={!ready}>
                <span className="cl-dl-ext">PDF</span>
                <span><strong>Facilitator answer key</strong>
                  Downloads print-ready — open it and press Ctrl/Cmd+P, Save as PDF</span>
              </button>
              <button className="cl-dl" onClick={() => exportHTML("handout")} disabled={!ready}>
                <span className="cl-dl-ext">PDF</span>
                <span><strong>Learner handout</strong>
                  Same case, answers stripped out, ruled boxes to write in</span>
              </button>
              <button className="cl-dl" onClick={exportExcel} disabled={!metrics}>
                <span className="cl-dl-ext">XLSX</span>
                <span><strong>Metrics workbook</strong>
                  Profile, trend table and the contact log with the cross-check</span>
              </button>
            </div>
            <p className="cl-fine">
              Both documents download as self-contained files already typeset for A4, so opening one
              and printing to PDF gives you the finished pack. Printing straight from this window is
              blocked in some browsers — the buttons below are a fallback only.
            </p>
            <div className="cl-actions">
              <button className="cl-btn cl-ghost" onClick={() => printDoc("key")}>Try printing the key here</button>
              <button className="cl-btn cl-ghost" onClick={() => printDoc("handout")}>Try printing the handout</button>
            </div>

            <div className="cl-rule" />
            <p className="cl-eyebrow">Close the loop</p>
            <h3 className="cl-h3">Now coach the person you just built</h3>
            <p className="cl-lede">
              Hands {p.name || "this teammate"} and these three contacts to the Practice tab, so the
              session runs against this case instead of a stock persona.
            </p>
            <button className="cl-btn cl-dark" disabled={!ready} onClick={() =>
              onCoach && onCoach({
                name: p.name, disc: p.disc, discNote: p.discNote, star: starText(p.star),
                tenure: p.tenure, context: p.context, behaviour: p.behaviour,
                kpm: p.kpm, accountLine, metrics,
                calls: scripts.filter((s) => !s.failed).map((s) =>
                  s.contact_id + " (" + s.driver + ", " + fmtSecs(s.duration_secs) + ", hold " +
                  fmtSecs(s.hold_secs) + "): " +
                  (s.evidence || []).map((e) => e.t + " " + e.type + " — " + e.ksb + ": " + e.note).join(" | ")
                ).join("\n"),
              })}>
              Coach {p.name || "this teammate"}
            </button>
            <div className="cl-actions">
              <button className="cl-btn cl-ghost" onClick={() => exportHTML("key")}>Answer key as HTML</button>
              <button className="cl-btn cl-ghost" onClick={() => exportHTML("handout")}>Handout as HTML</button>
            </div>
            <div className="cl-actions">
              <button className="cl-btn cl-ghost" onClick={() => setStep(3)}>Back to answers</button>
            </div>
          </div>
          <ProfileCard p={p} accountLine={accountLine} />
        </div>
      )}

      {ready && (
        <PrintDoc p={p} accountLine={accountLine} metrics={metrics} scripts={scripts}
          answers={answers} check={check} mode={printMode} />
      )}
    </div>
  );
}

/* ---------------------------- pieces ------------------------------ */

function Field({ label, children }) {
  return <label className="cl-field"><span>{label}</span>{children}</label>;
}

function Progress({ n, total }) {
  return <div className="cl-progress"><span style={{ width: (n / total) * 100 + "%" }} /></div>;
}

function MetricsTable({ metrics, onEdit }) {
  return (
    <div className="cl-tablewrap">
      <table className="cl-metrics">
        <thead>
          <tr>{metrics.columns.map((c, i) => <th key={i} className={/standard/i.test(c) ? "cl-th-std" : ""}>{c}</th>)}</tr>
        </thead>
        <tbody>
          {metrics.rows.map((row, r) => (
            <tr key={r}>{row.map((cell, c) => (
              <td key={c} className={c === 0 ? "cl-td-period" : ""}>
                <input value={cell} aria-label={metrics.columns[c] + ", row " + (r + 1)}
                  onChange={(e) => onEdit(r, c, e.target.value)} />
              </td>
            ))}</tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function CrossCheck({ check, tolerance = 15 }) {
  // Handle time, talk and wrap are reported in seconds on a scorecard; only hold reads as mm:ss.
  const show = (label, v) => (/hold/i.test(label) ? fmtSecs(v) : Math.round(v) + " secs");
  const bad = check.filter((r) => !r.aligned);
  return (
    <div className={"cl-check" + (bad.length ? " is-off" : "")}>
      <p className="cl-eyebrow">Cross-check</p>
      <h3>{bad.length ? "The contacts do not match the table" : "Contacts match the table"}</h3>
      <p className="cl-lede">
        {bad.length
          ? "These transcripts would contradict the numbers in front of the learners. Regenerate, or edit the table to match."
          : "Averaged across the three contacts, every figure lands within " + tolerance + "% of the latest pay period."}
      </p>
      <p className="cl-fine">
        Handle time is rebuilt from talk + hold + after-call work. Conversation length excludes wrap, because
        wrap happens after the customer has gone. Anything more than {tolerance}% out is flagged.
      </p>
      <table className="cl-checktable">
        <thead><tr><th>Metric</th><th>From the table</th><th>From the contacts</th><th>Delta</th><th>Status</th></tr></thead>
        <tbody>
          {check.map((r) => (
            <tr key={r.label} className={r.aligned ? "" : "is-off"}>
              <td>{r.label}</td><td>{show(r.label, r.table)}</td><td>{show(r.label, r.calls)}</td>
              <td>{(r.delta > 0 ? "+" : "") + r.delta + "%"}</td>
              <td>{r.aligned ? "OK" : "Off"}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function Transcript({ s, n, showKey = true }) {
  const [open, setOpen] = useState(n === 1);
  if (s.failed) return (
    <div className="cl-activity">
      <p className="cl-error">
        <strong>Not generated</strong> — contact {n} failed{s.reason ? ": " + s.reason : ""}. Regenerate the transcripts.
      </p>
    </div>
  );
  // Evidence is keyed on an exact turn timestamp; anything that misses still gets shown below.
  const times = new Set((s.turns || []).map((t) => t.t));
  const evAt = {};
  const orphans = [];
  (s.evidence || []).forEach((e) => { times.has(e.t) ? (evAt[e.t] = e) : orphans.push(e); });
  return (
    <section className="cl-activity">
      <div className="cl-act-head">
        <span className="cl-act-n">{String(n).padStart(2, "0")}</span>
        <h3>{s.contact_id}</h3>
        <button className="cl-btn cl-ghost cl-small" onClick={() => setOpen(!open)}>{open ? "Collapse" : "Expand"}</button>
      </div>
      <div className="cl-meta">
        <span><b>{s.driver}</b></span>
        <span>{s.date}</span>
        <span className={s.short ? "cl-flag" : ""}>
          Duration {s.duration_secs} secs ({fmtSecs(s.duration_secs)})
          {s.short ? " · shorter than its target" : ""}
        </span>
        <span>Talk {s.talk_secs} secs</span>
        <span className={s.hold_secs > 60 ? "cl-flag" : ""}>Hold {fmtSecs(s.hold_secs)}</span>
        <span>ACW {s.acw_secs} secs</span>
        <span>{s.disposition}</span>
      </div>
      {open && (
        <div className="cl-transcript">
          {(s.turns || []).map((t, i) => {
            const e = evAt[t.t];
            return (
              <div key={i} className={"cl-line cl-sp-" + String(t.speaker).toLowerCase()}>
                <span className="cl-t">{t.t}</span>
                <span className="cl-spk">{t.speaker}</span>
                <span className="cl-txt">
                  {t.text}
                  {showKey && e && <em className={"cl-ann cl-" + e.type}>{e.type === "miss" ? "Miss" : "Strength"} · {e.ksb} — {e.note}</em>}
                </span>
              </div>
            );
          })}
          {showKey && orphans.length > 0 && (
            <div className="cl-orphans">
              <p className="cl-eyebrow">Evidence without a matching timestamp</p>
              {orphans.map((e, k) => (
                <em key={k} className={"cl-ann cl-" + e.type}>
                  {e.t} · {e.type === "miss" ? "Miss" : "Strength"} · {e.ksb} — {e.note}
                </em>
              ))}
            </div>
          )}
        </div>
      )}
      {open && s.outcome && <p className="cl-outcome">{s.outcome}</p>}
    </section>
  );
}

function ProfileCard({ p, accountLine }) {
  return (
    <aside className="cl-profile">
      <div className="cl-profile-head">
        <div className="cl-profile-slash" aria-hidden="true" />
        <h3>Your Teammate's Profile</h3>
      </div>
      <div className="cl-profile-body">
        <p className="cl-account">{accountLine}</p>
        <Row k="Name" v={p.name || "—"} />
        <Row k="DISC style" v={p.disc} note={p.discNote} />
        <Row k="Attendance" v={p.attendance} />
        <Row k="Star Status" v={starText(p.star)} note={p.context} />
        <Row k="Tenure" v={p.tenure} />
      </div>
    </aside>
  );
}

function Row({ k, v, note }) {
  return (
    <div className="cl-prow">
      <p><strong>{k}:</strong> {v}</p>
      {note && <ul>{note.split(";").filter((s) => s.trim()).map((s, i) => <li key={i}>{s.trim()}</li>)}</ul>}
    </div>
  );
}

/* -------------------------- print surface ------------------------- */

function PrintDoc({ p, accountLine, metrics, scripts, answers, check, mode }) {
  const key = mode === "key";
  return (
    <div className="cl-print" aria-hidden="true">
      <section className="pg pg-cover">
        <div className="pg-slashbig" />
        <p className="pg-kicker">Coaching case study</p>
        <h1>{p.name}</h1>
        <p className="pg-sub">{accountLine}</p>
        <p className="pg-badge">{key ? "Facilitator answer key" : "Learner handout"}</p>
        <p className="pg-disclaimer">
          Internal training material. The teammate, the contacts and the performance data in this
          document are illustrative and do not depict real people or real customer interactions.
        </p>
      </section>

      <section className="pg">
        <h2>Your Teammate's Profile</h2>
        <table className="pg-meta"><tbody>
          {[["Name", p.name], ["Tenure", p.tenure],
            ["DISC style", p.disc + (p.discNote ? " — " + p.discNote : "")],
            ["Attendance", p.attendance], ["Star Status", starText(p.star)],
            ["Context", p.context], ["Account", accountLine]].map(([k, v]) => (
            <tr key={k}><td>{k}</td><td>{v}</td></tr>
          ))}
        </tbody></table>

        <h2>Performance Trend Report</h2>
        <table className="pg-table">
          <thead><tr>{metrics.columns.map((c, i) => <th key={i}>{c}</th>)}</tr></thead>
          <tbody>{metrics.rows.map((r, i) => <tr key={i}>{r.map((c, j) => <td key={j}>{c}</td>)}</tr>)}</tbody>
        </table>
        {key && metrics.story && <p className="pg-ans">{metrics.story}</p>}
      </section>

      <section className="pg">
        <h2>Contact Evidence</h2>
        {key && check && (
          <table className="pg-table">
            <thead><tr><th>Metric</th><th>Table</th><th>Contacts</th><th>Delta</th></tr></thead>
            <tbody>{check.map((r) => (
              <tr key={r.label}><td>{r.label}</td><td>{fmtSecs(r.table)}</td>
                <td>{fmtSecs(r.calls)}</td><td>{(r.delta > 0 ? "+" : "") + r.delta + "%"}</td></tr>
            ))}</tbody>
          </table>
        )}
        {scripts.filter((s) => !s.failed).map((s, i) => (
          <div key={i} className="pg-call">
            <h3>{s.contact_id} — {s.driver}</h3>
            <p className="pg-callmeta">
              {s.date} · Duration {fmtSecs(s.duration_secs)} · Talk {fmtSecs(s.talk_secs)} ·
              Hold {fmtSecs(s.hold_secs)} · ACW {fmtSecs(s.acw_secs)} · {s.disposition}
            </p>
            {(s.turns || []).map((t, j) => (
              <p key={j} className="pg-line"><span className="pg-t">{t.t}</span><b>{t.speaker}:</b> {t.text}</p>
            ))}
            {key && (s.evidence || []).length > 0 && (
              <div className="pg-ev">
                {(s.evidence || []).map((e, j) => (
                  <p key={j} className="pg-ans">
                    {e.t} · {e.type === "miss" ? "MISS" : "STRENGTH"} · {e.ksb} — {e.note}
                  </p>
                ))}
              </div>
            )}
          </div>
        ))}
      </section>

      <section className="pg">
        <h2>Activities</h2>
        {answers.map((a, i) => (
          <div key={a.id} className="pg-act">
            <h3>{i + 1}. {a.title}</h3>
            <p className="pg-prompt">{a.prompt}</p>
            {a.fields.map((f, j) => (
              <div key={j}>
                <p className="pg-lab">{f.label}</p>
                {key ? <p className="pg-ans">{f.value}</p> : (
                  <div className="pg-blank"
                    style={{ height: Math.min(60, 14 + Math.round((f.value || "").length / 14)) + "mm" }} />
                )}
              </div>
            ))}
          </div>
        ))}
      </section>
    </div>
  );
}

function buildPrintHTML({ p, accountLine, metrics, scripts, answers, check, mode }) {
  const key = mode === "key" || mode === "early";
  const isEarly = mode === "early";
  const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  let h = "<!doctype html><html><head><meta charset='utf-8'><title>" + esc(p.name) + " — " +
    (isEarly ? "Metrics & Profile" : key ? "Answer Key" : "Handout") + "</title>" +
    "<link href='https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap' rel='stylesheet'>" +
    "<style>" + PRINT_CSS + `
.printbar{position:fixed;top:0;left:0;right:0;background:#101010;color:#fff;padding:10px 16px;
  font-size:13px;font-family:Archivo,sans-serif;z-index:99;display:flex;gap:12px;align-items:center}
.printbar b{font-weight:700}
.printbar button{background:#C0202A;color:#fff;border:0;padding:7px 14px;font:inherit;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;font-size:11px;cursor:pointer}
body{padding-top:46px}
@media print{.printbar{display:none}body{padding-top:0}}
` + "</style></head><body>" +
    "<div class='printbar'><b>Ready to save.</b> Press Ctrl+P (Cmd+P on Mac) and choose Save as PDF." +
    "<button onclick='window.print()'>Print now</button></div>";

  h += "<section class='pg pg-cover'><div class='pg-slashbig'></div>" +
    "<p class='pg-kicker'>Coaching case study</p><h1>" + esc(p.name) + "</h1>" +
    "<p class='pg-sub'>" + esc(accountLine) + "</p><p class='pg-badge'>" +
    (isEarly ? "Metrics & profile only \u2014 transcripts not yet generated" : key ? "Facilitator answer key" : "Learner handout") + "</p>" +
    "<p class='pg-disclaimer'>Internal training material. The teammate, the contacts and the performance " +
    "data in this document are illustrative and do not depict real people or real customer interactions.</p></section>";

  h += "<section class='pg'><h2>Your Teammate's Profile</h2><table class='pg-meta'><tbody>";
  [["Name", p.name], ["Tenure", p.tenure], ["DISC style", p.disc + (p.discNote ? " — " + p.discNote : "")],
   ["Attendance", p.attendance], ["Star Status", starText(p.star)], ["Context", p.context], ["Account", accountLine]]
    .forEach(([k, v]) => { h += "<tr><td>" + esc(k) + "</td><td>" + esc(v) + "</td></tr>"; });
  h += "</tbody></table><h2>Performance Trend Report</h2><table class='pg-table'><thead><tr>";
  metrics.columns.forEach((c) => (h += "<th>" + esc(c) + "</th>"));
  h += "</tr></thead><tbody>";
  metrics.rows.forEach((r) => { h += "<tr>"; r.forEach((c) => (h += "<td>" + esc(c) + "</td>")); h += "</tr>"; });
  h += "</tbody></table>";
  if (key && metrics.story) h += "<p class='pg-ans'>" + esc(metrics.story) + "</p>";
  h += "</section>";

  if (isEarly) { h += "</body></html>"; return h; }

  h += "<section class='pg'><h2>Contact Evidence</h2>";
  if (key && check) {
    h += "<table class='pg-table'><thead><tr><th>Metric</th><th>Table</th><th>Contacts</th><th>Delta</th></tr></thead><tbody>";
    check.forEach((r) => {
      h += "<tr><td>" + esc(r.label) + "</td><td>" + fmtSecs(r.table) + "</td><td>" +
        fmtSecs(r.calls) + "</td><td>" + (r.delta > 0 ? "+" : "") + r.delta + "%</td></tr>";
    });
    h += "</tbody></table>";
  }
  scripts.filter((s) => !s.failed).forEach((s) => {
    h += "<div class='pg-call'><h3>" + esc(s.contact_id) + " — " + esc(s.driver) + "</h3>" +
      "<p class='pg-callmeta'>" + esc(s.date) + " · Duration " + fmtSecs(s.duration_secs) +
      " · Talk " + fmtSecs(s.talk_secs) + " · Hold " + fmtSecs(s.hold_secs) +
      " · ACW " + fmtSecs(s.acw_secs) + " · " + esc(s.disposition) + "</p>";
    (s.turns || []).forEach((t) => {
      h += "<p class='pg-line'><span class='pg-t'>" + esc(t.t) + "</span><b>" + esc(t.speaker) + ":</b> " + esc(t.text) + "</p>";
    });
    if (key) (s.evidence || []).forEach((e) => {
      h += "<p class='pg-ans'>" + esc(e.t) + " · " + (e.type === "miss" ? "MISS" : "STRENGTH") +
        " · " + esc(e.ksb) + " — " + esc(e.note) + "</p>";
    });
    h += "</div>";
  });
  h += "</section><section class='pg'><h2>Activities</h2>";
  answers.forEach((a, i) => {
    h += "<div class='pg-act'><h3>" + (i + 1) + ". " + esc(a.title) + "</h3><p class='pg-prompt'>" + esc(a.prompt) + "</p>";
    a.fields.forEach((f) => {
      h += "<p class='pg-lab'>" + esc(f.label) + "</p>";
      h += key ? "<p class='pg-ans'>" + esc(f.value) + "</p>"
        : "<div class='pg-blank' style='height:" +
          Math.min(60, 14 + Math.round((f.value || "").length / 14)) + "mm'></div>";
    });
    h += "</div>";
  });
  h += "</section></body></html>";
  return h;
}

const PERIODS = ["Aug 16-31", "Sept 1-15", "Sept 16-30"];

/* Observed-call evidence rides on the SAME trajectory data that already drives
   each persona's scorecard — no separate authoring needed. The rule (fixed by
   design, not computed): exactly 3 calls always show the behaviour missing.
   Any period where this persona's deviation sits well below their own average
   is a real, trajectory-consistent moment where they got it right — that
   becomes an extra observed call, capped at 2 so the total never exceeds 5
   (a realistic ceiling for what a lead can review before one conversation). */
function exceptionPeriods(traj) {
  const avg = (traj[0] + traj[1] + traj[2]) / 3;
  if (avg <= 0.4) return []; // the whole trend is already mild — no standout "good" moment to carve out
  const threshold = avg * 0.55;
  return traj.map((v, i) => ({ i, v })).filter(({ v }) => v < threshold).map(({ i }) => i).slice(0, 2);
}

function fmtMetric(key, val) {
  const m = METRICS[key];
  if (!m) return String(val);
  if (m.unit === "%") return Math.round(val) + "%";
  if (m.unit === "secs") return Math.round(val) + " secs";
  if (m.unit === "/4") return (Math.round(val * 10) / 10) + "/4";
  if (m.unit === "clock") {
    const t = Math.round(val);
    return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");
  }
  return String(val);
}

/* Shapes are signed deviation from standard in the metric's own direction:
   -13 on compliance means 13% below standard; +18 on AHT means 18% above it. */
function applyDev(key, std, devPct) {
  const m = METRICS[key] || {};
  let v = std * (1 + devPct / 100);
  if (m.max !== undefined) v = Math.min(v, m.max);   // nobody posts 96% CSAT
  if (m.min !== undefined) v = Math.max(v, m.min);
  return v;
}

function buildScorecard(scenarioId, programId, behaviourId) {
  const sh = SHAPES[scenarioId];
  const prog = PROGRAMS.find((x) => x.id === programId);
  const beh = BEHAVIOURS.find((x) => x.id === behaviourId);
  if (!sh || !prog || !beh) return null;

  const cols = ["Pay Period"];
  prog.tracks.forEach((k) => { cols.push(METRICS[k].label); cols.push("Std"); });

  const devAt = (k, i) => {
    const t = sh.traj[i];
    let d = 0;
    if (beh.footprint[k] !== undefined) d += beh.footprint[k] * t;        // the behaviour's cost
    if (sh.lift && sh.lift[k] !== undefined) d += sh.lift[k] * t;         // what improved alongside
    if (sh.spread && beh.footprint[k] === undefined) d += sh.spread * t;  // decline bleeding outward
    if (d === 0) d = 2;                                                   // quietly fine
    return d;
  };

  const rows = PERIODS.map((per, i) => {
    const r = [per];
    prog.tracks.forEach((k) => {
      r.push(fmtMetric(k, applyDev(k, prog.stds[k], devAt(k, i))));
      r.push(fmtMetric(k, prog.stds[k]));
    });
    return r;
  });

  const breaches = prog.tracks.filter((k) => {
    const v = applyDev(k, prog.stds[k], devAt(k, 2));
    return METRICS[k].better === "up" ? v < prog.stds[k] * 0.995 : v > prog.stds[k] * 1.005;
  }).map((k) => METRICS[k].label);

  let focusKey = null, worst = 0;
  prog.tracks.forEach((k) => {
    const adverse = METRICS[k].better === "up" ? -devAt(k, 2) : devAt(k, 2);
    if (adverse > worst) { worst = adverse; focusKey = k; }
  });

  const untouched = prog.tracks.filter((k) => beh.footprint[k] === undefined).map((k) => METRICS[k].label);

  // Team context belongs in the conversation, not on a one-to-one scorecard.
  const teamContext = sh.teamMatch
    ? "Everyone on this LOB posts roughly these same numbers — the whole team breaches the same standards you do."
    : sh.team
    ? "The team average on these metrics is roughly a third of your deviation — most people are close to standard."
    : null;

  return { cols, rows, breaches, untouched, program: prog, behaviour: beh, teamContext,
           focus: focusKey ? METRICS[focusKey].label : null, tell: sh.tell };
}

    hint: "QAQ probing that reaches a real root cause, not the first answer" },
  { key: "counsel", letter: "C", label: "Counsel",
    hint: "Connect, agree the way forward, then build or fix a SMART action plan together" },
  { key: "hold", letter: "H", label: "Hold Accountable",
    hint: "Both sides \u2014 what the coach will do, what the teammate will do, and the impact if nothing changes" },
];
/* Only for the "not a coaching problem" band. */
const LIMIT_DIM = { key: "limit", letter: "!", label: "Recognised the limit",
  hint: "Saw that coaching alone will not fix this, and changed course" };
/* For the "hard to coach" band — the challenge is getting through, not knowing when to stop. */
const GUARD_DIM = { key: "guard", letter: "+", label: "Got past the guard",
  hint: "Moved a closed teammate to genuinely engaged, rather than settling for polite compliance" };

function MicButton({ onTranscript, disabled }) {
  const [state, setState] = useState("idle"); // idle | recording | transcribing | error
  const [err, setErr] = useState("");
  const recRef = useRef(null);
  const chunksRef = useRef([]);
  const streamRef = useRef(null);

  async function start() {
    setErr("");
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      streamRef.current = stream;
      chunksRef.current = [];
      const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
        ? "audio/webm;codecs=opus" : "audio/webm";
      const rec = new MediaRecorder(stream, { mimeType: mime });
      recRef.current = rec;
      rec.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunksRef.current.push(e.data); };
      rec.onstop = () => { streamRef.current?.getTracks().forEach((t) => t.stop()); finish(); };
      rec.start();
      setState("recording");
    } catch (e) {
      setErr("Mic access denied or unavailable.");
      setState("error");
    }
  }

  function stop() {
    if (recRef.current && state === "recording") {
      recRef.current.stop();
      setState("transcribing");
    }
  }

  async function finish() {
    const mime = recRef.current?.mimeType || "audio/webm";
    const blob = new Blob(chunksRef.current, { type: mime });
    if (blob.size < 1000) { setState("idle"); return; }
    try {
      const res = await fetch("/api/transcribe", {
        method: "POST",
        headers: { "Content-Type": mime },
        body: blob,
      });
      if (!res.ok) throw new Error("Transcription failed (" + res.status + ")");
      const data = await res.json();
      if (data.text) onTranscript(data.text.trim());
      setState("idle");
    } catch (e) {
      setErr("Could not transcribe. Type your response instead.");
      setState("error");
    }
  }

  const recording = state === "recording";
  const busy = state === "transcribing";

  return (
    <span className="cl-mic-wrap">
      <button type="button" className={"cl-mic" + (recording ? " is-rec" : "")}
        disabled={disabled || busy}
        onMouseDown={start} onMouseUp={stop} onMouseLeave={recording ? stop : undefined}
        onTouchStart={start} onTouchEnd={stop}
        aria-pressed={recording} aria-label={recording ? "Recording, release to stop" : "Hold to speak"}>
        {busy ? "…" : recording ? "● Rec" : "🎤"}
      </button>
      {err && <span className="cl-mic-err">{err}</span>}
    </span>
  );
}

function Practice({ handoff, onClearHandoff }) {
  const handoffAgent = handoff && handoff.name ? {
    id: "handoff", name: handoff.name, tag: "From your case study",
    brief: "Tenure " + handoff.tenure + ". DISC " + handoff.disc + " — " + handoff.discNote +

  const [agent, setAgent] = useState(handoffAgent || SCENARIOS[0]);
  const [program, setProgram] = useState("tmobile");
  const [behaviour, setBehaviour] = useState(BEHAVIOURS[0].id);
  const [band, setBand] = useState("all");
  const [cardOpen, setCardOpen] = useState(true);

  const [busy, setBusy] = useState(false);
