  const [scoring, setScoring] = useState(false);
  const [error, setError] = useState("");
  const [observations, setObservations] = useState(null);
  const [obsBusy, setObsBusy] = useState(false);
  const [obsError, setObsError] = useState("");
  const endRef = useRef(null);

  useEffect(() => { if (endRef.current) endRef.current.scrollIntoView({ behavior: "smooth" }); }, [turns, busy]);
  useEffect(() => { setObservations(null); setObsError(""); }, [agent.id, program, behaviour]);

  const isUncoachable = agent.band === "none";
  const activeRubric = isUncoachable ? [...RUBRIC, LIMIT_DIM]
    : agent.band === "low" ? [...RUBRIC, GUARD_DIM]
    : RUBRIC;

  // The scenario's own scorecard, or the real one handed over from a case study.
  const card = handoff && agent.id === "handoff" && handoff.metrics
    ? { focus: handoff.kpm, cols: handoff.metrics.columns, rows: handoff.metrics.rows,
        tell: handoff.metrics.story, program: { name: handoff.accountLine },
        behaviour: { label: handoff.behaviour || "the flagged behaviour" }, breaches: [], untouched: [] }
    : buildScorecard(agent.id, program, behaviour);
  const programName = card && card.program ? card.program.name : "";
  const topic = card && card.behaviour ? card.behaviour.label : "performance";

  const cardText = card
    ? card.cols.join(" | ") + "\n" + card.rows.map((r) => r.join(" | ")).join("\n")
    : "";

  const shape = SHAPES[agent.id]; // only exists for the 13 built-in personas, not a case-study handoff

  async function buildObservations() {
    if (!shape || !card) return;
    setObsBusy(true); setObsError("");
    try {
      const exceptions = exceptionPeriods(shape.traj);
      const gapIdx = [0, 1, 2].filter((i) => !exceptions.includes(i));
      const totalCalls = 3 + exceptions.length;

      // The chronological slate of calls to write: 3 gap calls spread across
      // the non-exception periods, plus one call per exception period.
      const slots = [];
      for (let n = 0; n < 3; n++) slots.push({ periodIdx: gapIdx[n % gapIdx.length], gap: true });
      exceptions.forEach((i) => slots.push({ periodIdx: i, gap: false }));
      slots.sort((a, b) => a.periodIdx - b.periodIdx);

      // Duration is computed, not left to the model — a "dead air" gap call
      // should run long, a "compliance" gap call should run suspiciously
      // short, because that's the account's own AHT standard deviated by
      // this exact behaviour's footprint. A strength call runs near standard,
      // since nothing was costing time on that one. Small random jitter so
      // three calls never land on an identical duration.
      const ahtStd = (card.program && card.program.stds && card.program.stds.aht) || 600;
      const footprintAht = (card.behaviour && card.behaviour.footprint && card.behaviour.footprint.aht) || 0;
      const callPlans = slots.map((s, idx) => {
        const devPct = s.gap ? footprintAht * shape.traj[s.periodIdx] : 0;
        const base = applyDev("aht", ahtStd, devPct);
        const jitter = 0.88 + Math.random() * 0.24;
        const durationSecs = Math.max(120, Math.round(base * jitter));
        return { idx, period: PERIODS[s.periodIdx], gap: s.gap, durationSecs, durationLabel: fmtDurationLong(durationSecs) };
      });
      const plansText = callPlans.map((c) =>
        "Call " + (c.idx + 1) + ": pay period " + c.period + ", duration " + c.durationLabel +
        ", behaviour is " + (c.gap ? "MISSING on this call" : "PRESENT and done well on this call")
      ).join("\n");

      const j = await callJSON({
        system:
          "You write short, specific call-observation notes for a coaching case study — like a team leader's own " +
          "notebook after listening to calls, before sitting down to coach someone.\n" +
          "For each call listed below, write:\n" +
          "- summary: one sentence, what the contact was actually about (the customer's real situation).\n" +
          "- behaviorNote: ONE specific moment — a timestamp that falls within the call's stated duration, what " +
          "the customer said or needed right then, and what the agent actually said in response. If the behaviour " +
          "is missing, the agent's line must clearly demonstrate the miss. If present, it must clearly demonstrate " +
          "doing it well.\n" +
          "- vocStart and vocEnd: the customer's likely sentiment at the start and end of the call — each exactly " +
          "one of Promoter, Passive, Detractor. A missed behaviour should plausibly move sentiment toward " +
          "Detractor by the end; a well-handled one should hold steady or move toward Promoter.\n" +
          "- date: a specific date inside the call's stated pay period.\n" +
          "Vary the calls — different customer situations each time, never the same sentence reworded.\n\n" +
          "Context:\nAgent: " + agent.name + " — " + agent.brief + "\nAccount: " + programName +
          "\nBehaviour focus: " + topic + (card.behaviour && card.behaviour.note ? " — " + card.behaviour.note : "") +
          "\nWhy this pattern happens: " + (shape.tell || "") + "\n\nCALLS TO WRITE:\n" + plansText + "\n\n" +
          'Return ONLY JSON: {"calls":[{"summary":"one sentence","date":"a date inside the stated pay period",' +
          '"behaviorNote":{"timestamp":"m:ss into the call","customerLine":"under 18 words","agentLine":"under 18 ' +
          'words, near-verbatim"},"vocStart":"Promoter|Passive|Detractor","vocEnd":"Promoter|Passive|Detractor"}, ...]}\n' +
          "Exactly " + totalCalls + " entries, same order as the calls listed above.",
        messages: [{ role: "user", content: "Write the call observations now." }],
        maxTokens: 1100,
      });

      const written = (j.calls || []).slice(0, totalCalls);
      const calls = callPlans.map((plan, i) => ({ ...plan, ...(written[i] || {}) }));
      const gapCount = calls.filter((c) => c.gap).length;
      setObservations({ calls, totalCalls, gapCount });
    } catch (e) {
      setObsError(e.message || "Could not generate the call observations. Try again.");
    }
    setObsBusy(false);
  }

  function exportPracticeCase(mode) {
    if (!observations || !card) return;
    const html = buildPracticeCaseHTML({ agent, programName, topic, card, observations, mode });
    const safe = agent.name.toLowerCase().replace(/[^a-z0-9]+/g, "-");
    try {
      download(new Blob([html], { type: "text/html" }), safe + "-" + (mode === "key" ? "answer-key" : "handout") + "-print-me.html");
    } catch (e) {
      setObsError("Download was blocked by the browser.");
    }
  }

  function buildFullCallPrompt(c) {
    const bn = c.behaviorNote || {};
    return "Write the FULL call transcript for this single contact — every turn, not a summary. This needs to " +
      "read like a real transcript a coach could sit down and listen to end to end.\n\n" +
      "CONTEXT\n" +
      "Account: " + programName + "\nAgent: " + agent.name + " — " + agent.brief +
      "\nBehaviour focus: " + topic + (card.behaviour && card.behaviour.note ? " — " + card.behaviour.note : "") + "\n\n" +
      "WHAT'S ALREADY ESTABLISHED — the full transcript must be consistent with this, not contradict it:\n" +
      "Date: " + (c.date || c.period) + "\nDuration: " + c.durationLabel + " (the final timestamp must land here, not before)\n" +
      "Short summary: " + (c.summary || "") + "\n" +
      "The behaviour is " + (c.gap ? "MISSING" : "PRESENT and done well") + " on this call.\n" +
      (bn.timestamp
        ? "Known moment at " + bn.timestamp + " — customer said, \"" + (bn.customerLine || "") + "\" and the agent " +
          "said, \"" + (bn.agentLine || "") + "\" — this exact exchange must appear at this exact timestamp in the " +
          "full transcript, word for word.\n"
        : "") +
      (c.vocStart && c.vocEnd
        ? "Customer sentiment starts " + c.vocStart + " and ends " + c.vocEnd + " — the conversation should " +
          "plausibly move that way by how it unfolds.\n"
        : "") +
      "\nHARD CONSTRAINTS\n" +
      "- Write EVERY turn from 00:00 to the final timestamp — do not skip ahead or summarize partway through.\n" +
      "- The known moment above must appear verbatim, at its exact timestamp.\n" +
      "- Leave real gaps between timestamps for a call this long — use SYSTEM lines for dead air, holds, system " +
      "checks (\"Agent searching account details — 35 seconds of silence\").\n" +
      "- The customer is a real person with a real problem, not a prop. Natural, short turns.\n" +
      "- Sound like this specific account — real product names, screens, policies, timeframes, jargon, not generic filler.\n\n" +
      "OUTPUT\n" +
      "Plain readable text, no JSON, no code block:\n\n" +
      "CONTACT — [invent a contact ID]\n" +
      (c.date || c.period) + " · Duration " + c.durationLabel + " · [Disposition]\n\n" +
      "[00:00] AGENT: ...\n[00:18] CUSTOMER: ...\n...every turn, in order...\n\nOUTCOME: one line on how it ended";
  }

  async function copyFullCallPrompt(c, idx) {
    try {
      await navigator.clipboard.writeText(buildFullCallPrompt(c));
      setCopiedCallIdx(idx);
      setTimeout(() => setCopiedCallIdx(null), 2500);
    } catch (e) {
      setObsError("Couldn't copy automatically — your browser may be blocking clipboard access.");
    }
  }

  const system =
    "You are roleplaying a contact centre agent in a one-to-one coaching session. Your name is " + agent.name +
    "." + (agent.disc ? " Your DISC style is " + agent.disc + ", and it shows in your pace, directness, how much " +
      "detail you want, and how you react to being challenged." : "") +
    " Character: " + agent.brief + " The session is about: " + topic + ". The user is your team leader.\n\n" +

    "OPENNESS — this is the most important instruction.\n" +
    "You move along four levels: GUARDED → OPENING → ENGAGED → COMMITTED. You begin at " +
    (agent.floor ? "OPENING" : "GUARDED") + ".\n" +
    "GUARDED: short answers, deflection, nothing volunteered.\n" +
    "OPENING: still careful, but answering properly. You volunteer one real detail.\n" +
    "ENGAGED: talking honestly about what actually happens on your calls. You admit something you were holding back.\n" +
    "COMMITTED: naming in your own words what you will do differently, and possibly asking for something you need.\n\n" +

    "MOVE UP ONE LEVEL whenever the coach does any of these, and say something that shows it:\n" +
    "- names something specific and accurate from your actual work\n" +
    "- acknowledges your side, or the difficulty, before correcting you\n" +
    "- asks a real question and then builds their next turn on what you actually said\n" +
    "- restates your point back to you accurately\n" +
    "- admits something themselves, or concedes a point to you\n" +
    "- leaves space instead of filling it\n" +
    "- specifically for you: " + (agent.opens || "genuine attention") + "\n\n" +

    "MOVE DOWN only if they lecture across several turns, dismiss what you just said, re-ask something you " +
    "already answered, pull rank, or read from a script. " +
    (agent.closes ? "For you in particular, this shuts you down: " + agent.closes + ".\n\n" : "\n\n") +

    "YOU MUST ACTUALLY MOVE. If the coach has made two or more of those moves, you cannot still be GUARDED. " +
    "A person who stays identical no matter how well they are handled is not realistic and ruins the exercise. " +
    "When someone genuinely reaches you, let it show — warmer tone, more detail, something volunteered that you " +
    "were sitting on. Do not make them earn it three times over. Equally, do not hand it over for free: one " +
    "generic 'I understand it's hard' is not enough, it has to be specific to you.\n\n" +

    "REGISTER — you work with this person every day. You are colleagues, not strangers.\n" +
    "- You speak English. This is a BPO floor, not a formal meeting. A stray 'kasi' or 'diba' is fine when the " +
    "feeling is strong; anything more is wrong.\n" +
    "- NEVER use 'po', 'opo', 'sir' or 'ma\u2019am'. You have known your team leader for months. 'Okay lang po sir' " +
    "is completely wrong for this relationship. You say 'I\u2019m okay, Coach' or 'I\u2019m good, Coach.'\n" +
    "- You address them as 'Coach', occasionally by first name. Greet the way your DISC style would: a High D is " +
    "brisk ('Morning, Coach'), a High I is warm and chatty ('Hi Coach, how are you?'), a High S is polite and a " +
    "little careful ('Good morning, Coach'), a High C gets to the point ('Hi Coach, you wanted to see me?').\n" +
    "- Respect here means professional, not deferential. Never sarcastic, never dismissive, never contemptuous. " +
    "Forbidden no matter how badly the coach handles you: 'so?', 'whatever', 'that is not my problem', " +
    "'seriously?', mocking, talking down, interrupting, or stage directions like eye-rolling.\n" +
    "- Disagreement is direct and respectful, in plain English. 'I don\u2019t think that\u2019s right, Coach.' " +
    "'Can I explain my side?' 'Honestly Coach, that\u2019s not how it went.' You will make your case, bring your " +
    "evidence, and hold your ground if you believe you are right. Being respectful does not mean caving.\n" +
    "- Resistance shows up as careful over-agreement, polite deflection, going quiet, nervous laughter, or a firmly " +
    "argued point \u2014 never as attitude.\n" +
    "- Frustration comes out as flatness or withdrawal, not sharpness. A flat 'okay, Coach' means you disagree and " +
    "have stopped saying so \u2014 that is your strongest expression of it.\n\n" +

    "HOW YOU TALK: like a real agent on a call floor — plain, direct, sometimes hesitant. " +
    "Two or three sentences while GUARDED or OPENING. Up to five once ENGAGED or COMMITTED, because people " +
    "talk more when they feel safe. Never analyse the conversation, never coach yourself, never break character.\n" +

    (cardText
      ? "\nYOUR SCORECARD — the coach can see this and so can you:\n" + cardText + "\n" +
        "You know roughly where you stand, the way a real agent does: you remember the headline number and " +
        "whether it went up or down, not every column. If the coach brings up your metrics, react in character " +
        "before you react to the data — someone GUARDED questions or minimises the number, someone ENGAGED " +
        "actually looks at it and tries to explain it. Never recite the whole table back. If the coach quotes a " +
        "figure accurately, that counts as naming something specific about your work and moves you up a level. " +
        "If the coach gets a number wrong, correct them — you would. " +
        "If they ask which metric YOU think you are struggling with, answer at your current level: guarded means " +
        "naming the safest one or saying you are not sure, engaged means naming the real one.\n" +
        (card && card.teamContext
          ? "- You also know how the rest of the floor is doing: " + card.teamContext + " You do not lead with " +
            "this, but if the coach asks how the team is doing, or asks whether anyone else has the same problem, " +
            "you say it plainly.\n"
          : "") +
        (card && card.untouched && card.untouched.length
          ? "- These are NOT your problem and you know it: " + card.untouched.join(", ") + ". If the coach raises " +
            "one of them, say so with the figure to back it up \u2014 'Coach, my " + card.untouched[0] +
            " is actually above standard' \u2014 and let them correct course. Do not invent a " +
            "problem you do not have.\n"
          : "")
      : "") +

    (isUncoachable
      ? "\nIMPORTANT — coaching cannot fix your situation, but that does NOT mean you stay cold. You warm up like " +
        "anyone else when handled well, and you climb the same four levels. The difference is where it lands: at " +
        "COMMITTED you do not produce a convincing action plan. Instead you tell the truth — " +
        (agent.truth || "that the real problem is not your performance") + " — quietly, and only to a coach who has " +
        "earned it. If the coach just runs the standard script at you, agree pleasantly, commit to nothing real, " +
        "and stay exactly where you started."
      : "") +
    (agent.id === "handoff" && handoff
      ? "\n\nYou work on " + handoff.accountLine + ". These are your own recent contacts, and you half-remember " +
        "them the way a real agent does — vaguely, defensively, and only in detail once the coach asks something " +
        "specific:\n" + handoff.calls +
        "\nNever recite this list. Never quote the coaching notes back. If the coach names a contact or a moment, " +
        "you can recall it; otherwise you do not bring it up."
      : "");

  // Input provenance. Measures how text ARRIVED in the box — typed, pasted, or bulk-inserted.
  const meta = useRef({ typed: 0, inserted: 0, pastes: 0, pending: 0, start: null });
  const lastLen = useRef(0);
  const [turnMeta, setTurnMeta] = useState([]);

  function resetMeta() {
    meta.current = { typed: 0, inserted: 0, pastes: 0, pending: 0, spoken: 0, start: null };
    lastLen.current = 0;
  }

  function handleSpoken(text) {
    if (!text) return;
    const insertion = (draft ? draft + " " : "") + text;
    const added = insertion.length - draft.length;
    if (!meta.current.start) meta.current.start = Date.now();
    meta.current.spoken = (meta.current.spoken || 0) + added;
    lastLen.current = insertion.length;
    setDraft(insertion);
  }

  function onDraftChange(e) {
    const v = e.target.value;
    const delta = v.length - lastLen.current;
    const m = meta.current;
    if (!m.start) m.start = Date.now();
    if (delta > 0) {
      if (m.pending > 0) {
        m.inserted += Math.min(delta, m.pending);
        m.typed += Math.max(0, delta - m.pending);
        m.pending = 0;
      } else if (delta > 15) {
        m.inserted += delta;   // bulk arrival with no paste event: drag-drop, autofill, or script
      } else {
        m.typed += delta;
      }
    }
    lastLen.current = v.length;
    setDraft(v);
  }

  function onPaste(e) {
    const t = (e.clipboardData && e.clipboardData.getData("text")) || "";
    meta.current.pending = t.length;
    meta.current.pastes += 1;
  }

  const draftPasted = meta.current.inserted > 0;

  function reset() {
    setStarted(false); setTurns([]); setScore(null); setDraft(""); setError("");
    setTurnMeta([]); resetMeta();
  }

  async function begin() {
    setStarted(true); setError(""); setBusy(true);
    try {
      const text = await callClaude({ system, messages: [{ role: "user",
        content: "[Your team leader has just sat down and said hello. Open the scene in character with one short line.]" }],
        maxTokens: 200 });
      setTurns([{ role: "assistant", content: text.trim() }]);
    } catch (e) { setError(e.message || "Could not reach the model. Try again."); }
    setBusy(false);
  }

  async function send() {
    const text = draft.trim();
    if (!text || busy) return;
    const m = meta.current;
    const secs = m.start ? (Date.now() - m.start) / 1000 : 0;
    setTurnMeta((prev) => [...prev, {
      typed: m.typed, inserted: m.inserted, pastes: m.pastes, spoken: m.spoken || 0,
      chars: text.length, secs: Math.round(secs * 10) / 10,
    }]);
    resetMeta();
    const next = [...turns, { role: "user", content: text }];
    setTurns(next); setDraft(""); setBusy(true); setError("");
    try {
      const reply = await callClaude({ system, messages: next, maxTokens: 300 });
      setTurns([...next, { role: "assistant", content: reply.trim() }]);
    } catch (e) { setError(e.message || "That turn did not go through. Send it again."); }
    setBusy(false);
  }

  async function grade() {
    if (turns.filter((t) => t.role === "user").length < 2) { setError("Run a few more turns before scoring."); return; }
    setScoring(true); setError("");
    const transcript = turns.map((t) => (t.role === "user" ? "COACH: " : "AGENT: ") + t.content).join("\n");
    try {
      const res = await callJSON({
        system:
          "You assess coaching conversations against the COACH certified coaching programme. Score only what the " +
          "COACH said, never the agent. Be demanding but fair. 0 = absent, 1 = gestured at, 2 = attempted but weak, " +
          "3 = done, 4 = done well.\n" +
          "communicate — three parts, scored by how many are present: (a) giraffe language, describing observable " +
          "behaviour and impact rather than labels or blame, (b) connected before correcting \u2014 any genuine " +
          "check-in, greeting or acknowledgement of the person before the problem, (c) refreshed the teammate\u2019s " +
          "personal or professional goal. All three = 4. Two = 3. One = 2. A bare hello only = 1. Nothing at all = 0. " +
          "IMPORTANT: if the TEAMMATE raises the problem first, that is not the coach leading with it \u2014 judge the " +
          "coach on what the coach did. Asking how someone is before moving to the metric counts as (b), even briefly.\n" +
          "observe — presented a tangible observation AND put the numbers in front of the teammate, either inviting " +
          "them to find it ('looking at your metrics, which one do you feel you are struggling with?') or naming it " +
          "directly, whichever suits this person. Then reached explicit AGREEMENT on the gap — the teammate said " +
          "something that shows they accept it. Score 4 only if the observation landed and agreement was reached. " +
          "Score 2 if the metric was named but the teammate never agreed. Score 0 if nothing specific was named.\n" +
          "analyze — used QAQ: asked, listened to the answer, then built the next question on that answer. Probed " +
          "past the first explanation to a root cause. Score 2 or below if they took the first reason given, stacked " +
          "questions without listening, or diagnosed on the teammate\u2019s behalf.\n" +
          "counsel — connected with the teammate on the way forward, then either applied SMART to an action plan " +
          "already on the table or built one with them from scratch. The action must address the ROOT CAUSE they " +
          "uncovered, and must be specific, measurable, attainable, relevant and time-bound — a target number and a " +
          "deadline both present. Best when the teammate proposes and the coach shapes. Score 1 for vague intent " +
          "like 'I will improve my empathy'. Score 0 if a solution was issued with no link to the root cause.\n" +
          "hold — three things. What the coach will do (when they check, what they review, the next touchpoint). " +
          "What the teammate will do to hold themselves accountable. AND the impact scenario: what actually happens " +
          "if the behaviour does not change, and what changes for them if it does — stated plainly and without " +
          "threat, tied to something the teammate cares about. Score 4 only with all three. Score 2 at most with " +
          "one of them missing. Score 0 if the session ended with no follow-up agreed at all.\n" +
          (isUncoachable
            ? "limit — did the coach notice this is not a straightforward skill gap and respond to what is actually " +
              "holding the behaviour in place, instead of running the script harder? Score 4 only if they named it " +
              "out loud and changed course. Score 0 if they drove to an action plan as though nothing were wrong.\n"
            : "") +
          (agent.band === "low" && !isUncoachable
            ? "guard — this teammate starts closed, and the job was to get through. Score 4 if they ended up " +
              "volunteering the real reason in their own words and committing to something they chose. Score 3 if " +
              "they opened up but the commitment came from the coach. Score 2 if they stayed polite and compliant " +
              "without ever opening. Score 0 if the coach settled for surface agreement and never noticed it was " +
              "surface. IMPORTANT: if the teammate genuinely opened up, the coach succeeded here — score it high. " +
              "Do not mark down a session that worked for having encountered no resistance.\n"
            : "") +
          "OUTPUT RULES: every key below is REQUIRED — never omit a stage, never stop early.\n" +
          "\"did\" describes what the COACH actually did to earn this score, in the past tense, naming the concrete " +
          "move: 'mentioned his AC savings goal before touching any metric', 'said he listened to three calls and " +
          "played the recording back', 'asked why the KB was not used, then followed the answer to habit and tab " +
          "visibility'. Under 25 words. Never a generic tip, never advice — only what happened.\n" +
          "\"quote\" is the coach's own words at the strongest moment, under 12 words, verbatim.\n" +
          "\"fix\" is ONLY for scores below 4 — the concrete thing to do instead, under 25 words. When the score is " +
          "4, return an empty string for fix. Do not pad a 4 with advice.\n" +
          "If a stage did not happen at all, set did to 'not in the transcript' and quote to an empty string.\n" +
          'Return ONLY JSON: {"scores":{' +
          activeRubric.map((r) => '"' + r.key + '":{"score":0,"did":"under 25 words","quote":"under 12 words","fix":"empty if score is 4"}').join(",") +
          '},"did_well":["2 short items, each under 20 words"],' +
          '"do_differently":["2 short items, each under 25 words, phrased as the line to say instead"],' +
          '"headline":"one sentence"}',
        messages: [{ role: "user", content:
          "Scenario: " + agent.name + " — " + agent.tag + " (" + (agent.disc || "n/a") + ", " +
          (BANDS.find((b) => b.id === agent.band)?.label || "unclassified") + ")\n\nTranscript:\n\n" + transcript }],
        maxTokens: 2000,
      });
      const missing = activeRubric.filter((r) => !res?.scores?.[r.key]).map((r) => r.label);
      if (missing.length) setError("Incomplete score — " + missing.join(", ") + " did not come back. Score again.");
      setScore(res);
    } catch (e) { setError(e.message || "Scoring failed. Try again."); }
    setScoring(false);
  }

  // Derived entirely from HOW the text arrived, never from how it reads.
  const authorship = React.useMemo(() => {
    if (!turnMeta.length) return null;
    const typed = turnMeta.reduce((a, t) => a + t.typed, 0);
    const inserted = turnMeta.reduce((a, t) => a + t.inserted, 0);
    const spoken = turnMeta.reduce((a, t) => a + (t.spoken || 0), 0);
    const pastes = turnMeta.reduce((a, t) => a + t.pastes, 0);
    const total = typed + inserted + spoken;
    const pct = total ? Math.round((inserted / total) * 100) : 0;
    // Sustained typing above ~18 chars/sec is faster than a person composing prose.
    const impossible = turnMeta.filter((t) => t.typed > 80 && t.secs > 0 && t.typed / t.secs > 18).length;
    const level = pct >= 60 || impossible > 1 ? "high" : pct >= 20 || impossible ? "some" : "low";
    return { typed, inserted, pastes, pct, impossible, level, turns: turnMeta.length,
      pastedTurns: turnMeta.filter((t) => t.inserted > 0).length };
  }, [turnMeta]);

  function transcriptText() {
    const head = "COACHING SESSION\n" + agent.name + " \u2014 " + agent.tag +
      (agent.disc ? " (" + agent.disc + ")" : "") + "\n" + programName + " \u2014 " + topic +
      "\n" + new Date().toLocaleString() + "\n" + "=".repeat(60) + "\n\n";
    return head + turns.map((t) => (t.role === "user" ? "COACH: " : agent.name.toUpperCase() + ": ") + t.content).join("\n\n");
  }

  function downloadTranscript() {
    const safe = agent.name.toLowerCase() + "-session";
    download(new Blob([transcriptText()], { type: "text/plain" }), safe + "-transcript.txt");
  }

  function downloadReport() {
    const esc = (x) => String(x == null ? "" : x)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    let h = "<!doctype html><html><head><meta charset='utf-8'><title>" + esc(agent.name) +
      " \u2014 coaching session</title>" +
      "<link href='https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap' rel='stylesheet'>" +
      "<style>" + PRINT_CSS + `
      .stage{page-break-inside:avoid;margin-bottom:6mm;padding-left:12mm;position:relative}
      .badge{position:absolute;left:0;top:0;width:8mm;height:8mm;border-radius:50%;color:#fff;
        font-family:Anton,sans-serif;font-size:10pt;display:flex;align-items:center;justify-content:center}
      .s4{background:#1F8A4C}.s3{background:#1F8A4C}.s2{background:#B5760A}.s1{background:#C0202A}.s0{background:#C0202A}
      .stage h4{margin:0 0 1mm;font-size:11pt}
      .did{margin:0 0 1.5mm;font-size:9.5pt}
      .quote{margin:0 0 1.5mm;font-size:9pt;color:#555;font-style:italic;border-left:1pt solid #ccc;padding-left:3mm}
      .fix{margin:0;font-size:9.5pt;color:#C0202A}
      .turn{margin:0 0 2mm;font-size:9.5pt}.turn b{color:#101010}
      .printbar{position:fixed;top:0;left:0;right:0;background:#101010;color:#fff;padding:10px 16px;
        font-size:13px;font-family:Archivo,sans-serif;z-index:99}
      .printbar button{background:#C0202A;color:#fff;border:0;padding:7px 14px;font:inherit;
        font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:11px;cursor:pointer;margin-left:12px}
      body{padding-top:46px}@media print{.printbar{display:none}body{padding-top:0}}
      ` + "</style></head><body>" +
      "<div class='printbar'><b>Ready to save.</b> Press Ctrl+P (Cmd+P on Mac) and choose Save as PDF." +
      "<button onclick='window.print()'>Print now</button></div>";

    h += "<section class='pg'><h2>Coaching session \u2014 " + esc(agent.name) + "</h2><table class='pg-meta'><tbody>";
    [["Teammate", agent.name + " \u2014 " + agent.tag], ["DISC style", agent.disc || "\u2014"],
     ["Account", programName], ["Behaviour coached", topic],
     ["Date", new Date().toLocaleString()], ["Turns", String(turns.filter((t) => t.role === "user").length)]]
      .forEach(([k, v]) => { h += "<tr><td>" + esc(k) + "</td><td>" + esc(v) + "</td></tr>"; });
    h += "</tbody></table>";

    if (card) {
      h += "<h2>Scorecard</h2><table class='pg-table'><thead><tr>";
      card.cols.forEach((c) => (h += "<th>" + esc(c) + "</th>"));
      h += "</tr></thead><tbody>";
      card.rows.forEach((r) => { h += "<tr>"; r.forEach((v) => (h += "<td>" + esc(v) + "</td>")); h += "</tr>"; });
      h += "</tbody></table>";
    }

    if (score) {
      h += "<h2>The COACH path</h2>";
      activeRubric.forEach((r) => {
        const sc = score.scores && score.scores[r.key];
        if (!sc) return;
        h += "<div class='stage'><div class='badge s" + (sc.score || 0) + "'>" + esc(r.letter) + "</div>" +
          "<h4>" + esc(r.label) + " \u2014 " + (sc.score || 0) + "/4</h4>" +
          "<p class='did'>" + esc(sc.did || sc.evidence) + "</p>";
        if (sc.quote) h += "<p class='quote'>\u201c" + esc(sc.quote) + "\u201d</p>";
        if (sc.fix) h += "<p class='fix'>" + esc(sc.fix) + "</p>";
        h += "</div>";
      });
      h += "<h3>Change this first</h3><p>" + esc(score.headline) + "</p>";
      if (score.did_well) h += "<h3>What you did well</h3><ul>" +
        score.did_well.map((d) => "<li>" + esc(d) + "</li>").join("") + "</ul>";
      if (score.do_differently) h += "<h3>Do differently next time</h3><ul>" +
        score.do_differently.map((d) => "<li>" + esc(d) + "</li>").join("") + "</ul>";
      if (authorship) h += "<p class='quote'>Own work: " + authorship.pct + "% of characters pasted or bulk-inserted across " +
        authorship.turns + " turns.</p>";
    }
    h += "</section><section class='pg'><h2>Transcript</h2>";
    turns.forEach((t) => {
      h += "<p class='turn'><b>" + (t.role === "user" ? "Coach" : esc(agent.name)) + ":</b> " + esc(t.content) + "</p>";
    });
    h += "</section></body></html>";

    const safe = agent.name.toLowerCase() + "-session";
    download(new Blob([h], { type: "text/html" }), safe + "-report-print-me.html");
  }

  if (!started) {
    return (
      <div className="cl-two">
        <div className="cl-card">
          <p className="cl-eyebrow">Step one</p>
          <h2 className="cl-h2">Pick a scenario</h2>
          <p className="cl-lede">
            Ordered by how far a coaching conversation can actually get. The last band is the point —
            not every performance problem is a coaching problem, and a lead who runs the script anyway
            makes it worse.
          </p>

          <div className="cl-chips">
            <button className={"cl-chip" + (band === "all" ? " is-on" : "")} onClick={() => setBand("all")}>

              .map((a) => (
                <button key={a.id} className={"cl-agent cl-b-" + (a.band || "handoff") +

                  <span className="cl-agent-top">
                    <span className="cl-agent-name">{a.name}</span>
                    {a.disc && <span className="cl-disc">{a.disc}</span>}
                  </span>
                  <span className="cl-agent-tag">{a.tag}</span>
                </button>
              ))}
          </div>
          {handoffAgent && (
            <p className="cl-fine">
              {handoffAgent.name} came from your case study and remembers those three contacts.{" "}
              <button className="cl-linkbtn" onClick={() => { setAgent(SCENARIOS[0]); onClearHandoff && onClearHandoff(); }}>
                Drop the case
              </button>
            </p>
          )}
          <p className="cl-eyebrow cl-mt">Step two</p>
          <h2 className="cl-h2">Pick the account</h2>
          <p className="cl-lede">
            The account decides which metrics exist. Domino’s tracks order completion and no FCR,
            because a repeat call is a new order. T-Mobile tracks FCR and transfer rate. Same person,
            different scorecard.
          </p>
          <div className="cl-accounts">
            {PROGRAMS.map((pr) => (
              <button key={pr.id} className={"cl-acct" + (program === pr.id ? " is-on" : "")}
                onClick={() => setProgram(pr.id)}>{pr.name}</button>
            ))}
          </div>
          {card && card.program && <p className="cl-fine">{card.program.note}</p>}

          <p className="cl-eyebrow cl-mt">Step three</p>
          <h2 className="cl-h2">What behaviour are you coaching?</h2>
          <p className="cl-lede">
            Coach the behaviour, not the number. The scorecard rebuilds around whatever you pick,
            so the metrics you see in the session are the consequence of this behaviour on this account.
          </p>
          <div className="cl-behaviours">
            {BEHAVIOURS.map((b) => (
              <button key={b.id} className={"cl-beh" + (behaviour === b.id ? " is-on" : "")}
                onClick={() => setBehaviour(b.id)}>
                <span className="cl-beh-label">{b.label}</span>
                <span className="cl-beh-note">{b.note}</span>
              </button>
            ))}
          </div>
          {card && card.breaches && (
            <p className="cl-fine">
              On {programName} this shows up as{" "}
              <strong>{card.breaches.length ? card.breaches.join(", ") : "no breach \u2014 pick another account"}</strong>.
            </p>
          )}

          <div className="cl-actions"><button className="cl-btn cl-go" onClick={begin}>Start the session</button></div>
        </div>
        <aside className="cl-profile">
          <div className="cl-profile-head"><div className="cl-profile-slash" aria-hidden="true" /><h3>{agent.name}</h3></div>
          <div className="cl-profile-body">
            {agent.band && (
              <p className="cl-account">
                {BANDS.find((b) => b.id === agent.band)?.label}{agent.disc ? " · " + agent.disc : ""}
              </p>
            )}
            <p className="cl-lede">{agent.brief}</p>
            {agent.opens && (
              <>
                <p className="cl-eyebrow cl-mt">What opens them up</p>
                <p className="cl-note">{agent.opens}</p>
              </>
            )}
            {agent.watch && (
              <>
                <p className="cl-eyebrow cl-mt">What usually goes wrong</p>
                <p className="cl-note">{agent.watch}</p>
              </>
            )}
            <p className="cl-eyebrow cl-mt">You will be scored on</p>
            <ul className="cl-tick">{activeRubric.map((r) => (
              <li key={r.key}>
                <strong>{r.label}</strong>
                {r.hint && <span className="cl-hint">{r.hint}</span>}
              </li>
            ))}</ul>
            {card && (
              <>
                <p className="cl-eyebrow cl-mt">Focus KPM</p>
                <p className="cl-note"><strong>{card.focus}</strong> — full scorecard opens in the session.</p>
              </>
            )}
          </div>
        </aside>
      </div>
    );
  }

  return (
    <div className="cl-session">
      <div className="cl-convo">
        <div className="cl-convo-head">
          <span className="cl-live">Live</span><strong>{agent.name}</strong>
          <span className="cl-sep">/</span><span>{programName}</span><span className="cl-sep">/</span><span>{topic}</span>
          {agent.band && <span className="cl-bandtag">{BANDS.find((b) => b.id === agent.band)?.label}</span>}
          <button className="cl-btn cl-ghost cl-right cl-small" onClick={reset}>End and reset</button>
        </div>
        {card && (
          <div className="cl-scorecard">
            <button className="cl-sc-toggle" onClick={() => setCardOpen(!cardOpen)}>
              <span className="cl-eyebrow">{agent.name}’s scorecard</span>
              <span>Focus KPM: <strong>{card.focus}</strong></span>
              <span className="cl-sc-chev">{cardOpen ? "Hide" : "Show"}</span>
            </button>
            {cardOpen && (
              <div className="cl-sc-body">
                <div className="cl-tablewrap">
                  <table className="cl-metrics cl-sc-table">
                    <thead><tr>{card.cols.map((c, i) =>
                      <th key={i} className={/std/i.test(c) ? "cl-th-std" : ""}>{c}</th>)}</tr></thead>
                    <tbody>{card.rows.map((r, i) => (
                      <tr key={i}>
                        {r.map((v, j) => <td key={j} className={j === 0 ? "cl-td-period" : ""}>{v}</td>)}
                      </tr>
                    ))}</tbody>
                  </table>
                </div>
                <div className="cl-sc-notes-row">
                  <button className={"cl-coachnote-btn" + (showTell ? " is-on" : "")} onClick={() => setShowTell(!showTell)}>
                    {showTell ? "Hide coach note" : "Coach note"}
                  </button>
                  {shape && (
                    <button className={"cl-coachnote-btn" + (showObs ? " is-on" : "")} onClick={() => { if (!observations && !obsBusy) buildObservations(); setShowObs(!showObs); }} disabled={obsBusy}>
                      {obsBusy ? "Pulling calls…" : showObs ? "Hide observation details" : "Observation details"}
                    </button>
                  )}
                </div>
                {card.tell && showTell && <p className="cl-story">{card.tell}</p>}
                {obsError && <p className="cl-error">{obsError}</p>}
                {showObs && observations && (
                  <div className="cl-obs">
                    <p className="cl-obs-summary">
                      {observations.gapCount} of {observations.totalCalls} observed calls this pay period — {topic.toLowerCase()} missing.
                    </p>
                    {observations.calls.map((c, i) => (
                      <div key={i} className={"cl-obs-card" + (c.gap ? " cl-obs-miss" : " cl-obs-strength")}>
                        <p className="cl-obs-callhead">
                          Call {i + 1} <span className="cl-obs-tag">{c.gap ? "Miss" : "Strength"}</span>
                        </p>
                        <p className="cl-obs-field"><strong>Duration:</strong> {c.durationLabel}</p>
                        {c.date && <p className="cl-obs-field"><strong>Date:</strong> {c.date}</p>}
                        {c.summary && <p className="cl-obs-field"><strong>Short Call Summary:</strong> {c.summary}</p>}
                        {c.behaviorNote && (
                          <p className="cl-obs-field">
                            <strong>Behavior Notes:</strong> — {c.behaviorNote.timestamp} customer said, “{c.behaviorNote.customerLine}” agent said, “{c.behaviorNote.agentLine}”
                          </p>
                        )}
                        {c.vocStart && <p className="cl-obs-field"><strong>VOC Start:</strong> {c.vocStart}</p>}
                        {c.vocEnd && <p className="cl-obs-field"><strong>VOC End:</strong> {c.vocEnd}</p>}
                        <button className="cl-btn cl-ghost cl-small cl-obs-callprompt" onClick={() => copyFullCallPrompt(c, i)}>
                          {copiedCallIdx === i ? "Copied ✓" : "📋 Copy prompt for full call"}
                        </button>
                      </div>
                    ))}
                    <div className="cl-actions">
                      <button className="cl-btn cl-ghost cl-small" onClick={buildObservations} disabled={obsBusy}>
                        {obsBusy ? "Regenerating…" : "Regenerate"}
                      </button>
                      <button className="cl-btn cl-ghost cl-small" onClick={() => exportPracticeCase("key")}>
                        📄 Answer key (PDF)
                      </button>
                      <button className="cl-btn cl-ghost cl-small" onClick={() => exportPracticeCase("handout")}>
                        📄 Handout (PDF)
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        )}

        <div className="cl-stream">
          {turns.map((t, i) => (
            <div key={i} className={"cl-turn cl-" + t.role}>
              <span className="cl-who">{t.role === "user" ? "You" : agent.name}</span>
              <p>{t.content}</p>
            </div>
          ))}
          {busy && <div className="cl-turn cl-assistant"><span className="cl-who">{agent.name}</span>
            <p className="cl-typing"><i /><i /><i /></p></div>}
          <div ref={endRef} />
        </div>
        {error && <p className="cl-error">{error}</p>}
        <div className="cl-compose">
          <div className="cl-compose-row">
            <textarea value={draft} onChange={onDraftChange} onPaste={onPaste}
              onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }}
              placeholder={"Say something to " + agent.name + "…"} rows={2} />
            <MicButton onTranscript={handleSpoken} disabled={busy} />
          </div>
          {draftPasted && (
            <p className="cl-pastewarn">
              Pasted text detected in this turn. It will be recorded — coaching is a live skill,
              and the point of the exercise is what you can say in the moment.
            </p>
          )}
          <div className="cl-actions">
            <button className="cl-btn cl-go" onClick={send} disabled={busy}>Send</button>
            <button className="cl-btn cl-dark cl-right" onClick={grade} disabled={scoring}>
              {scoring ? "Scoring…" : "End and score me"}
            </button>
          </div>
        </div>
      </div>
      <aside className="cl-rail">
        <p className="cl-eyebrow">The COACH path</p>
        {!score && <p className="cl-lede">Five stages. They light up when you end the session and score it.</p>}

        <ol className="cl-path">
          {activeRubric.map((r) => {
            const sc = score?.scores?.[r.key];
            const v = sc ? sc.score : null;
            const state = v === null ? "off" : v >= 3 ? "hit" : v === 2 ? "part" : "miss";
            return (
              <li key={r.key} className={"cl-node cl-n-" + state}>
                <span className="cl-node-dot">{r.letter}</span>
                <div className="cl-node-body">
                  <div className="cl-node-top">
                    <strong>{r.label}</strong>
                    <span className="cl-node-score">{v === null ? "—" : v + "/4"}</span>
                  </div>
                  {!score && r.hint && <p className="cl-hint">{r.hint}</p>}
                  {sc && (
                    <>
                      {(sc.did || sc.evidence) && <p className="cl-did">{sc.did || sc.evidence}</p>}
                      {sc.quote && <p className="cl-ev">\u201c{sc.quote}\u201d</p>}
                      {sc.fix && <p className="cl-fix">{sc.fix}</p>}
                    </>
                  )}
                </div>
              </li>
            );
          })}
        </ol>

        {score && (
          <div className="cl-debrief">
            <p className="cl-eyebrow">Change this first</p>
            <p className="cl-headline">{score.headline}</p>

            {score.did_well?.length > 0 && (
              <>
                <p className="cl-eyebrow cl-mt">What you did well</p>
                <ul className="cl-dw">{score.did_well.map((d, i) => <li key={i}>{d}</li>)}</ul>
              </>
            )}
            {score.do_differently?.length > 0 && (
              <>
                <p className="cl-eyebrow cl-mt">Do differently next time</p>
                <ul className="cl-dd">{score.do_differently.map((d, i) => <li key={i}>{d}</li>)}</ul>
              </>
            )}
          </div>
        )}

        {turns.length > 0 && (
          <div className="cl-dl-row">
            <button className="cl-btn cl-ghost cl-small" onClick={downloadTranscript}>Transcript .txt</button>
            <button className="cl-btn cl-ghost cl-small" onClick={downloadReport}>
              {score ? "Full report" : "Report so far"}
            </button>
          </div>
        )}

        {score && authorship && (
          <div className={"cl-authorship cl-a-" + authorship.level}>
            <p className="cl-eyebrow">Own work</p>
            <div className="cl-auth-top">
              <span className="cl-auth-pct">{authorship.pct}%</span>
              <span className="cl-auth-label">
                {authorship.level === "low" ? "typed live" :
                 authorship.level === "some" ? "pasted in" : "pasted in"}
              </span>
            </div>
            <p className="cl-auth-body">
              {authorship.level === "low"
                ? "All " + authorship.turns + " turns were typed in the moment. That is the skill being practised."
                : authorship.pct + "% of your characters arrived by paste or bulk insert, across " +
                  authorship.pastedTurns + " of " + authorship.turns + " turns" +
                  (authorship.impossible ? ", plus " + authorship.impossible + " turn(s) entered faster than a person types" : "") +
                  ". A coaching session cannot be paused to fetch an answer."}
            </p>
          </div>
        )}
      </aside>
    </div>
  );
}

/* Turns a Practice persona's current selection (account + behaviour + the
   observations the coach pulled) into the same two-flavour PDF pack the
   Case Study Builder produces — for when a built-in persona is good enough
   to use as-is, instead of building a new case from scratch. */
function buildPracticeCaseHTML({ agent, programName, topic, card, observations, mode }) {
  const key = mode === "key";
  const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const accountLine = programName + " · " + topic;

  let h = "<!doctype html><html><head><meta charset='utf-8'><title>" + esc(agent.name) + " — " +
    (key ? "Answer Key" : "Handout") + "</title>" +
    "<link href='https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap' rel='stylesheet'>" +
    "<style>" +
    "@page{size:A4;margin:13mm 14mm}" +
    "*{box-sizing:border-box}" +
    "body{font-family:Archivo,Calibri,sans-serif;font-size:9.5pt;color:#1A1A1A;line-height:1.4;margin:0;padding-top:40px}" +
    ".printbar{position:fixed;top:0;left:0;right:0;background:#101010;color:#fff;padding:9px 16px;font-size:12.5px;" +
      "font-family:Archivo,sans-serif;z-index:99;display:flex;gap:12px;align-items:center}" +
    ".printbar b{font-weight:700}" +
    ".printbar button{background:#C0202A;color:#fff;border:0;padding:6px 13px;font:inherit;font-weight:700;" +
      "text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;cursor:pointer}" +
    "@media print{.printbar{display:none}body{padding-top:0}}" +
    ".doc{max-width:190mm;margin:0 auto;padding:4mm 6mm}" +
    ".head{position:relative;border-bottom:3px solid #C0202A;padding-bottom:8px;margin-bottom:10px;overflow:hidden}" +
    ".head-slash{position:absolute;top:-5mm;left:-9mm;width:16mm;height:13mm;background:#7C1219;transform:skewX(-18deg);opacity:.9}" +
    ".head h1{position:relative;font-family:Anton,sans-serif;font-size:22pt;margin:0;text-transform:uppercase;letter-spacing:.01em}" +
    ".head p{position:relative;margin:2px 0 0;font-size:9.5pt;color:#555}" +
    ".badge{position:relative;display:inline-block;margin-top:5px;background:#101010;color:#fff;padding:2px 9px;" +
      "font-size:8pt;letter-spacing:.08em;text-transform:uppercase;font-weight:700}" +
    ".profile-line{font-size:9pt;color:#333;margin:0 0 3px}" +
    ".profile-line b{color:#101010}" +
    "h2{font-family:Anton,sans-serif;font-size:12.5pt;text-transform:uppercase;letter-spacing:.02em;" +
      "border-bottom:1.5pt solid #C0202A;padding-bottom:2px;margin:10px 0 6px}" +
    "table.mt{border-collapse:collapse;width:100%;font-size:7.8pt;margin-bottom:6px}" +
    "table.mt th{background:#101010;color:#fff;padding:3px 4px;text-align:center;font-weight:600}" +
    "table.mt td{border:.5pt solid #B8B8B8;padding:3px 4px;text-align:center}" +
    "table.mt td:first-child,table.mt th:first-child{text-align:left;font-weight:600}" +
    ".tell{font-size:8.5pt;color:#555;font-style:italic;margin:0 0 8px;padding:5px 8px;background:#FBEDEE;border-left:2.5pt solid #C0202A}" +
    ".obs-summary{font-size:9pt;font-weight:700;background:#F4F4F4;padding:5px 9px;margin:0 0 8px}" +
    ".call{page-break-inside:avoid;border:.75pt solid #DCDCDC;border-left:2.5pt solid #DCDCDC;padding:6px 9px;margin-bottom:6px}" +
    ".call.miss{border-left-color:#C0202A}" +
    ".call.strength{border-left-color:#1F8A4C}" +
    ".call-head{display:flex;align-items:center;gap:7px;margin:0 0 3px}" +
    ".call-head b{font-family:Anton,sans-serif;font-size:10.5pt}" +
    ".tag{font-size:7pt;letter-spacing:.07em;text-transform:uppercase;font-weight:700;border:.75pt solid #C0202A;color:#C0202A;padding:0 5px}" +
    ".call.strength .tag{border-color:#1F8A4C;color:#1F8A4C}" +
    ".field{margin:0 0 2.5px;font-size:8.5pt}" +
    ".field b{color:#101010}" +
    ".blankline{display:inline-block;border-bottom:.75pt solid #999;min-width:55mm;height:9pt;vertical-align:bottom}" +
    "</style></head><body>" +
    "<div class='printbar'><b>Ready to save.</b> Press Ctrl+P (Cmd+P on Mac) and choose Save as PDF." +
    "<button onclick='window.print()'>Print now</button></div>" +
    "<div class='doc'>";

  h += "<div class='head'><div class='head-slash'></div><h1>" + esc(agent.name) + "</h1>" +
    "<p>" + esc(accountLine) + "</p>" +
    "<span class='badge'>" + (key ? "Facilitator answer key" : "Learner handout") + "</span></div>";

  h += "<p class='profile-line'><b>DISC:</b> " + esc(agent.disc || "—") +
    " &nbsp;·&nbsp; <b>Coachability:</b> " + esc((BANDS.find((b) => b.id === agent.band) || {}).label || "") +
    " &nbsp;·&nbsp; <b>Profile:</b> " + esc(agent.tag) + "</p>" +
    "<p class='profile-line'>" + esc(agent.brief) + "</p>";

  h += "<h2>Performance Trend</h2><table class='mt'><thead><tr>";
  card.cols.forEach((c) => (h += "<th>" + esc(c) + "</th>"));
  h += "</tr></thead><tbody>";
  card.rows.forEach((r) => { h += "<tr>"; r.forEach((c) => (h += "<td>" + esc(c) + "</td>")); h += "</tr>"; });
  h += "</tbody></table>";
  if (key && card.tell) h += "<p class='tell'>" + esc(card.tell) + "</p>";

  h += "<h2>Call Observations</h2>";
  if (observations && observations.calls && observations.calls.length) {
    h += "<p class='obs-summary'>" + observations.gapCount + " of " + observations.totalCalls +
      " observed calls this pay period — " + esc(topic.toLowerCase()) + " missing.</p>";
    observations.calls.forEach((c, i) => {
      h += "<div class='call " + (c.gap ? "miss" : "strength") + "'>" +
        "<div class='call-head'><b>Call " + (i + 1) + "</b>" +
        (key ? "<span class='tag'>" + (c.gap ? "Miss" : "Strength") + "</span>" : "") + "</div>" +
        "<p class='field'><b>Duration:</b> " + esc(c.durationLabel) + "</p>" +
        "<p class='field'><b>Date:</b> " + esc(c.date || c.period) + "</p>";
      if (c.summary) h += "<p class='field'><b>Short Call Summary:</b> " + esc(c.summary) + "</p>";
      if (c.behaviorNote) {
        h += "<p class='field'><b>Behavior Notes:</b> — " + esc(c.behaviorNote.timestamp) + " customer said, \u201c" +
          esc(c.behaviorNote.customerLine) + "\u201d agent said, \u201c" + esc(c.behaviorNote.agentLine) + "\u201d</p>";
      }
      if (key) {
        h += "<p class='field'><b>VOC Start:</b> " + esc(c.vocStart) + " &nbsp;·&nbsp; <b>VOC End:</b> " + esc(c.vocEnd) + "</p>";
      } else {
        h += "<p class='field'><b>Your read:</b> <span class='blankline'></span> &nbsp; " +
          "<b>VOC Start:</b> <span class='blankline' style='min-width:20mm'></span> &nbsp; " +
          "<b>VOC End:</b> <span class='blankline' style='min-width:20mm'></span></p>";
      }
      h += "</div>";
    });
  }
  h += "</div></body></html>";
  return h;
}

.cl-sc-toggle { width: 100%; display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 10px 16px; text-align: left; font-size: 12.5px; }
.cl-sc-toggle .cl-eyebrow { margin: 0; }
.cl-sc-chev { margin-left: auto; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); }
.cl-sc-toggle:hover .cl-sc-chev { color: var(--ink); }
.cl-sc-body { padding: 0 16px 14px; }
.cl-sc-table td { padding: 7px 9px; text-align: center; font-size: 12.5px; background: var(--white); }
.cl-sc-table td.cl-td-period { text-align: left; font-weight: 700; white-space: nowrap; }
.cl-sc-tell { margin-top: 10px; font-size: 12px; }
.cl-sc-notes-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.cl-coachnote-btn {
  background: var(--white); color: var(--red); border: 1.5px solid var(--red); border-radius: 3px;
  padding: 6px 13px; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
}
.cl-coachnote-btn:hover { background: var(--red); color: var(--white); }
.cl-coachnote-btn.is-on { background: var(--red); color: var(--white); }
.cl-coachnote-btn:disabled { opacity: .5; border-color: var(--line); color: var(--soft); background: var(--white); }
.cl-linkbtn { background: none; border: 0; padding: 0; color: var(--red); text-decoration: underline; font-size: inherit; }

.cl-profile { background: var(--white); border: 1px solid var(--line); overflow: hidden; }
.cl-profile-head { position: relative; background: var(--black); padding: 16px 18px; overflow: hidden; }
.cl-profile-slash { position: absolute; top: 0; left: -30px; width: 90px; height: 100%; background: var(--red-deep); transform: skewX(-18deg); }
.cl-profile-head h3 { position: relative; font-family: Anton, sans-serif; font-size: 19px; color: var(--white); text-transform: uppercase; letter-spacing: .05em; margin: 0; text-align: right; }
.cl-profile-body { padding: 16px 18px; }
.cl-account { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; color: var(--red); margin: 0 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.cl-prow { margin-bottom: 11px; }
.cl-prow p { margin: 0; font-size: 13.5px; }
.cl-prow strong { color: var(--black); }
.cl-prow ul { margin: 4px 0 0; padding-left: 17px; }
.cl-prow li { font-size: 12.5px; color: var(--soft); margin-bottom: 2px; }
.cl-tick { margin: 0; padding: 0; list-style: none; }
.cl-tick li { font-size: 13px; color: var(--ink); padding: 7px 0; border-bottom: 1px solid var(--line); }
.cl-hint { display: block; font-size: 11.5px; color: var(--soft); margin-top: 2px; line-height: 1.4; }

.cl-tablewrap { overflow-x: auto; border: 1px solid var(--line); }
.cl-metrics { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.cl-metrics th { background: var(--black); color: var(--white); padding: 9px 10px; text-align: center; font-weight: 600; font-size: 11px; white-space: nowrap; }
.cl-metrics th.cl-th-std { background: #3A3A3A; color: #CFCFCF; font-weight: 400; }
.cl-metrics td { border: 1px solid var(--line); padding: 0; }
.cl-metrics input { width: 100%; min-width: 86px; border: 0; background: transparent; padding: 8px 9px; text-align: center; font-size: 12.5px; }
.cl-metrics input:focus { background: var(--red-wash); outline: none; }
.cl-metrics td.cl-td-period input { text-align: left; font-weight: 700; min-width: 130px; }
.cl-notes { background: #FAFAFA; border: 1px solid var(--line); padding: 14px 16px; margin-top: 14px; }
.cl-notes textarea { width: 100%; border: 1px solid var(--line); background: var(--white); padding: 10px; font-size: 13.5px; resize: vertical; }
.cl-notes .cl-fine { margin: 0 0 8px; }
.cl-story { border-left: 3px solid var(--red); background: var(--red-wash); padding: 11px 14px; font-size: 13.5px; margin: 14px 0 0; }

.cl-check { background: var(--white); border: 1px solid var(--line); border-left: 4px solid var(--black); padding: 20px 22px; margin-bottom: 14px; }
.cl-check.is-off { border-left-color: var(--red); }
.cl-check h3 { font-family: Anton, sans-serif; font-size: 20px; text-transform: uppercase; letter-spacing: .03em; margin: 0 0 6px; }
.cl-checktable { border-collapse: collapse; width: 100%; font-size: 13px; }
.cl-checktable th { text-align: left; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--soft); padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); }
.cl-checktable td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); }
.cl-checktable tr.is-off td { color: var(--red); font-weight: 700; }

.cl-keybar { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.cl-keybar .cl-h2 { margin: 0; }
.cl-toggle { margin-left: auto; display: flex; border: 1px solid var(--ink); }
.cl-toggle button { background: var(--white); border: 0; padding: 8px 16px; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--soft); }
.cl-toggle button.is-on { background: var(--black); color: var(--white); }

.cl-activity { background: var(--white); border: 1px solid var(--line); border-left: 4px solid var(--red); padding: 20px 22px; margin-bottom: 12px; }
.cl-act-head { display: flex; align-items: baseline; gap: 11px; }
.cl-act-n { font-family: Anton, sans-serif; font-size: 15px; color: var(--red); }
.cl-act-head h3 { font-family: Anton, sans-serif; font-size: 21px; text-transform: uppercase; letter-spacing: .03em; margin: 0; flex: 1; }
.cl-mins { font-size: 11.5px; color: var(--soft); font-weight: 700; }
.cl-act-prompt { font-size: 13.5px; color: var(--soft); font-style: italic; margin: 6px 0 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.cl-field-block { margin-bottom: 14px; }
.cl-flabel { font-size: 10px; letter-spacing: .13em; text-transform: uppercase; font-weight: 700; color: var(--black); margin: 0 0 5px; }
.cl-answer { width: 100%; border: 1px solid var(--line); border-left: 3px solid var(--blue); background: #FAFBFD; padding: 10px 12px; font-size: 13.5px; color: var(--blue); line-height: 1.55; resize: vertical; }
.cl-answer:focus { background: var(--white); outline: none; border-color: var(--ink); border-left-color: var(--blue); }
.cl-blank { border: 1px solid var(--ink); height: 74px; background: var(--white); }

.cl-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--soft); margin: 8px 0 0; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.cl-meta b { color: var(--ink); }
.cl-meta .cl-flag { color: var(--red); font-weight: 700; }
.cl-transcript { margin-top: 14px; }
.cl-line { display: grid; grid-template-columns: 52px 74px 1fr; gap: 8px; padding: 5px 0; font-size: 13.5px; align-items: baseline; }
.cl-t { color: #AAA; font-size: 11.5px; }
.cl-spk { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--soft); }
.cl-sp-agent .cl-spk { color: var(--black); }
.cl-sp-system .cl-txt { font-style: italic; color: var(--soft); }
.cl-ann { display: block; margin-top: 5px; font-size: 12px; font-style: normal; padding: 6px 10px; border-left: 3px solid var(--blue); background: #F7F9FC; color: var(--blue); }
.cl-ann.cl-miss { border-left-color: var(--red); background: var(--red-wash); color: var(--red-deep); }
.cl-outcome { font-size: 13px; color: var(--soft); font-style: italic; margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--line); }

.cl-obs { margin-top: 14px; }
.cl-obs-summary { font-size: 13.5px; font-weight: 700; color: var(--ink); background: var(--paper); padding: 9px 13px; margin: 0 0 12px; }
.cl-obs-card { border: 1px solid var(--line); border-left: 3px solid var(--line); padding: 12px 14px; background: var(--white); margin-bottom: 10px; }
.cl-obs-card.cl-obs-miss { border-left-color: var(--red); }
.cl-obs-card.cl-obs-strength { border-left-color: #1F8A4C; }
.cl-obs-callhead { font-family: Anton, sans-serif; font-size: 14px; letter-spacing: .02em; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.cl-obs-tag { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--red); border: 1px solid var(--red); padding: 1px 6px; }
.cl-obs-strength .cl-obs-tag, .cl-obs-card.cl-obs-strength .cl-obs-tag { color: #1F8A4C; border-color: #1F8A4C; }
.cl-obs-field { margin: 0 0 5px; font-size: 12.5px; color: var(--ink); line-height: 1.5; }
.cl-obs-field strong { color: var(--black); }
.cl-obs-callprompt { margin-top: 6px; }

.cl-downloads { display: flex; flex-direction: column; gap: 10px; }
.cl-dl { display: flex; gap: 16px; align-items: center; text-align: left; background: var(--white); border: 1px solid var(--ink); padding: 16px 18px; }
.cl-dl:hover { background: var(--red-wash); border-color: var(--red); }
.cl-dl:disabled { border-color: var(--line); opacity: .5; cursor: default; }
.cl-dl-ext { font-family: Anton, sans-serif; font-size: 15px; letter-spacing: .05em; background: var(--black); color: var(--white); padding: 9px 11px; flex-shrink: 0; }
.cl-dl span { font-size: 12.5px; color: var(--soft); }
.cl-dl span strong { display: block; font-size: 15px; margin-bottom: 2px; color: var(--ink); }

.cl-session { display: grid; grid-template-columns: 1fr 330px; gap: 24px; align-items: start; }
.cl-convo { background: var(--white); border: 1px solid var(--line); }
.cl-convo-head { display: flex; align-items: center; gap: 9px; padding: 11px 16px; border-bottom: 1px solid var(--line); font-size: 13px; }
.cl-live { font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; font-weight: 700; background: var(--red); color: var(--white); padding: 3px 7px; }
.cl-sep { color: var(--line); }
.cl-stream { padding: 18px 16px; min-height: 320px; max-height: 50vh; overflow-y: auto; }
.cl-turn { margin-bottom: 15px; max-width: 78%; }
.cl-turn p { margin: 0; padding: 10px 13px; font-size: 14px; }
.cl-who { font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; font-weight: 700; color: var(--soft); display: block; margin-bottom: 3px; }
.cl-assistant p { background: var(--paper); border-left: 3px solid var(--line); }
.cl-user { margin-left: auto; }
.cl-user p { background: var(--black); color: var(--white); }
.cl-user .cl-who { text-align: right; }
.cl-typing { display: flex; gap: 4px; align-items: center; }
.cl-typing i { width: 5px; height: 5px; border-radius: 50%; background: var(--soft); animation: cl-blink 1.3s infinite; }
.cl-typing i:nth-child(2) { animation-delay: .18s; }
.cl-typing i:nth-child(3) { animation-delay: .36s; }
@keyframes cl-blink { 0%,60%,100% { opacity: .25 } 30% { opacity: 1 } }
.cl-compose { border-top: 1px solid var(--line); padding: 12px 16px; }
.cl-compose textarea { width: 100%; border: 1px solid var(--line); padding: 10px; resize: vertical; font-size: 14px; background: #FCFCFC; }
.cl-compose-row { display: flex; gap: 8px; align-items: flex-start; }
.cl-compose-row textarea { flex: 1; }
.cl-mic-wrap { display: flex; flex-direction: column; align-items: center; }
.cl-mic { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--ink); background: var(--white); font-size: 17px; flex-shrink: 0; }
.cl-mic:hover { background: var(--paper); }
.cl-mic.is-rec { background: var(--red); border-color: var(--red); color: var(--white); animation: cl-blink 1.3s infinite; }
.cl-mic:disabled { opacity: .5; cursor: default; }
.cl-mic-err { font-size: 10px; color: var(--red); text-align: center; margin-top: 4px; max-width: 70px; }
.cl-compose .cl-actions { margin-top: 9px; }

.cl-agents { display: grid; grid-template-columns: repeat(auto-fill,minmax(160px,1fr)); gap: 8px; }
.cl-agent { background: var(--white); border: 1px solid var(--line); border-left: 4px solid var(--line); padding: 12px 14px; text-align: left; }
.cl-agent.is-on { border-color: var(--ink); border-left-color: var(--red); }
.cl-agent-name { display: block; font-family: Anton, sans-serif; font-size: 19px; text-transform: uppercase; letter-spacing: .04em; }
.cl-agent-tag { display: block; font-size: 11px; color: var(--soft); margin-top: 2px; }
.cl-chips { display: flex; flex-wrap: wrap; gap: 7px; }
.cl-chip { background: var(--white); border: 1px solid var(--line); padding: 7px 13px; font-size: 13.5px; }
.cl-chip:hover { border-color: var(--ink); }
.cl-chip.is-on { background: var(--red); border-color: var(--red); color: var(--white); }
.cl-chip.cl-breach:not(.is-on) { border-color: var(--red); color: var(--red-deep); }
.cl-behaviours { display: grid; grid-template-columns: repeat(auto-fill,minmax(215px,1fr)); gap: 8px; }
.cl-beh { background: var(--white); border: 1px solid var(--line); border-left: 4px solid var(--line); padding: 11px 13px; text-align: left; }
.cl-beh:hover { border-color: var(--ink); }
.cl-beh.is-on { border-color: var(--ink); border-left-color: var(--red); background: var(--red-wash); }
.cl-beh-label { display: block; font-size: 13.5px; font-weight: 600; }
.cl-beh-note { display: block; font-size: 11.5px; color: var(--soft); margin-top: 3px; line-height: 1.35; }

.cl-rail { background: var(--white); border: 1px solid var(--line); padding: 18px; }
.cl-did { font-size: 12.5px; margin: 5px 0 4px; }
.cl-ev { font-size: 11.5px; color: var(--soft); margin: 0 0 5px; padding-left: 9px; border-left: 2px solid var(--line); font-style: italic; }
.cl-fix { font-size: 12.5px; margin: 0; padding: 6px 9px; background: var(--red-wash); border-left: 2px solid var(--red); }
.cl-headline { font-size: 14.5px; font-weight: 600; margin: 0 0 8px; }
.cl-kept { font-size: 13px; color: var(--soft); margin: 0; }

.cl-progress { height: 4px; background: var(--line); margin-top: 14px; }
.cl-progress span { display: block; height: 100%; background: var(--red); transition: width .35s; }

.cl-print { display: none; }

@media (max-width: 900px) {
  .cl-two, .cl-session { grid-template-columns: 1fr; }
  .cl-grid2 { grid-template-columns: 1fr; }
  .cl-main { padding: 20px 16px 50px; }
  .cl-top { padding: 0 16px; }
  .cl-tabs { overflow-x: auto; }
  .cl-turn { max-width: 92%; }
  .cl-line { grid-template-columns: 44px 1fr; }
  .cl-line .cl-spk { grid-column: 2; }
  .cl-line .cl-txt { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) { .cl *, .cl *::before { animation: none !important; transition: none !important; } }

@media print {
  .cl-app { display: none !important; }
  .cl { background: #fff; }
  .cl-print { display: block !important; }
  ${PRINT_CSS}
}
`;


ReactDOM.createRoot(document.getElementById("root")).render(<CoachLabRoot />);

</script>
</body>
</html>
